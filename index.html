  if (s.includes('=')) s = s.slice(s.lastIndexOf('=') + 1);
  const f = compile(s), val = f({ x: NaN, y: NaN });
  if (!Number.isFinite(val)) throw new Error('That doesn’t work out to a number');
  return val;
}
function checkAnswer(q, raw) {
  if (q.type === 'num') return close(readNumber(raw), q.answer);
  if (q.type === 'set') {
    let s = raw.replace(/\b(and|or)\b/gi, ',').replace(/x\s*=/gi, '');
    const vals = s.split(/[,;]/).map(t => t.trim()).filter(Boolean).map(readNumber);
    if (!vals.length) throw new Error('Type an answer first');
    const uniq = [];
    vals.forEach(v => { if (!uniq.some(u => close(v, u))) uniq.push(v); });
    return uniq.length === q.answer.length && q.answer.every(a => uniq.some(u => close(u, a)));
  }
  if (q.type === 'line') {
    const s = raw.trim();
    if (!s) throw new Error('Type an answer first');
    let F;
    if (s.includes('=')) {
      const [L, R] = s.split('=');
      if (!L.trim() || !R.trim() || s.split('=').length > 2) throw new Error('Use one “=” sign');
      const l = compile(L), r = compile(R); F = v => l(v) - r(v);
    } else { const r = compile(s); F = v => v.y - r(v); }
    return [-2, 0.5, 3].every(x => {
      const y = q.lineF(x);
      const on = F({ x, y }), off = F({ x, y: y + 1 });
      return Number.isFinite(on) && Math.abs(on) < 1e-6 && Math.abs(off) > 1e-6;
    });
  }
}
function previewText(q, raw) {
  if (!raw.trim()) return { t: '' };
  try {
    if (q.type === 'num') { const v = readNumber(raw); return { t: 'Reads as ≈ ' + fmt(v) }; }
    if (q.type === 'set') {
      const s = raw.replace(/\b(and|or)\b/gi, ',').replace(/x\s*=/gi, '');
      const vals = s.split(/[,;]/).map(t => t.trim()).filter(Boolean).map(readNumber);
      return { t: 'Reads as x ≈ ' + vals.map(fmt).join(', ') };
    }
    if (q.type === 'line') {
      const s = raw.trim();
      if (s.includes('=')) { const [L, R] = s.split('='); compile(L); compile(R || '0'); } else compile(s);
      return { t: 'Looks readable ✓' };
    }
    if (q.type === 'expr') {
      let s = raw.trim(); if (s.includes('=')) s = s.slice(s.lastIndexOf('=') + 1);
      const f = compile(s); f({ t: 1, x: NaN, y: NaN });
      return { t: 'Looks readable ✓' };
    }
  } catch (e) { return { t: e.message, err: true }; }
}
const fmt = v => Number.isInteger(v) ? String(v) : (Math.round(v * 10000) / 10000).toString();

/* ============================================================
   Graph drawing
   ============================================================ */
function graphSVG(g) {
  const W = 400, H = 320, P = 24;
  const sx = x => P + (x - g.xmin) / (g.xmax - g.xmin) * (W - 2 * P);
  const sy = y => H - P - (y - g.ymin) / (g.ymax - g.ymin) * (H - 2 * P);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${g.caption}" xmlns="http://www.w3.org/2000/svg" font-family="Atkinson Hyperlegible, sans-serif">`;
  s += `<defs><clipPath id="plotclip"><rect x="${P}" y="${P}" width="${W - 2 * P}" height="${H - 2 * P}"/></clipPath></defs>`;
  for (let x = g.xmin; x <= g.xmax; x++) s += `<line x1="${sx(x)}" y1="${sy(g.ymin)}" x2="${sx(x)}" y2="${sy(g.ymax)}" stroke="var(--plot-grid)" stroke-width="1"/>`;
  for (let y = g.ymin; y <= g.ymax; y++) s += `<line x1="${sx(g.xmin)}" y1="${sy(y)}" x2="${sx(g.xmax)}" y2="${sy(y)}" stroke="var(--plot-grid)" stroke-width="1"/>`;
  s += `<line x1="${sx(g.xmin)}" y1="${sy(0)}" x2="${sx(g.xmax)}" y2="${sy(0)}" stroke="var(--axis)" stroke-width="1.6"/>`;
  s += `<line x1="${sx(0)}" y1="${sy(g.ymin)}" x2="${sx(0)}" y2="${sy(g.ymax)}" stroke="var(--axis)" stroke-width="1.6"/>`;
  g.asym.forEach(a => { s += `<line x1="${sx(a)}" y1="${sy(g.ymin)}" x2="${sx(a)}" y2="${sy(g.ymax)}" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="6 5"/>`; });
  for (let x = g.xmin; x <= g.xmax; x++) if (x !== 0) s += `<text x="${sx(x)}" y="${sy(0) + 15}" font-size="11" text-anchor="middle" fill="var(--muted)" stroke="var(--paper)" stroke-width="3" paint-order="stroke">${x < 0 ? '−' + (-x) : x}</text>`;
  for (let y = g.ymin; y <= g.ymax; y++) if (y !== 0) s += `<text x="${sx(0) - 6}" y="${sy(y) + 4}" font-size="11" text-anchor="end" fill="var(--muted)">${y < 0 ? '−' + (-y) : y}</text>`;
  s += `<text x="${sx(g.xmax) - 2}" y="${sy(0) - 6}" font-size="13" font-style="italic" text-anchor="end" fill="var(--ink)">${g.xlab || 'x'}</text>`;
  s += `<text x="${sx(0) + 6}" y="${sy(g.ymax) + 12}" font-size="13" font-style="italic" fill="var(--ink)">${g.ylab || 'y'}</text>`;
  s += '<g clip-path="url(#plotclip)">';
  g.curves.forEach(c => {
    let d = '', pen = false; const N = 400;
    for (let i = 0; i <= N; i++) {
      const x = c.a + (c.b - c.a) * i / N, y = c.f(x);
      if (!Number.isFinite(y) || y > g.ymax + 3 || y < g.ymin - 3) { pen = false; continue; }
      d += (pen ? 'L' : 'M') + sx(x).toFixed(2) + ' ' + sy(y).toFixed(2) + ' '; pen = true;
    }
    s += `<path d="${d}" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  s += '</g>';
  g.open.forEach(([x, y]) => { s += `<circle cx="${sx(x)}" cy="${sy(y)}" r="5.5" fill="var(--paper)" stroke="var(--blue)" stroke-width="2.6"/>`; });
  g.closed.forEach(([x, y]) => { s += `<circle cx="${sx(x)}" cy="${sy(y)}" r="5.5" fill="var(--blue)" stroke="var(--blue)" stroke-width="2"/>`; });
  return s + '</svg>';
}

Q.forEach(q => { q.id = String(q.day); q.unit = 'u2'; q.set = 'D'; });

/* ============================================================

   ============================================================ */
const KEY = 'dailyDerivative_unit2_v1'; // kept so earlier progress carries over
let store = { a: {} };
try { const raw = localStorage.getItem(KEY); if (raw) store = JSON.parse(raw) || store; } catch (e) {}
if (!store.a) store.a = {};
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

let view = { name: 'home', filter: 'all' };
let draft = {};              // in-progress answers, not yet submitted
const retrying = new Set();  // questions reopened with "Try this one again"

const app = document.getElementById('app');
const recOf = id => store.a[id];
function statusOf(id) { const r = store.a[id]; return !r ? 'new' : (r.correct ? 'ok' : 'no'); }
function everMissed(id) { const r = store.a[id]; return !!r && (!r.correct || (r.hist || []).some(h => !h.correct)); }
function nextDay() {
  const firstNew = Q.find(q => statusOf(q.id) === 'new');
  if (firstNew) return firstNew.day;
  const firstMiss = Q.find(q => statusOf(q.id) === 'no');
  return firstMiss ? firstMiss.day : null;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function curTab() {
  if (!store.seenU4) { store.seenU4 = 1; store.tab = 'u4'; save(); } // open on the newest unit once
  return store.tab || 'u4';
}

window.typesetApp = function () {

const LOGO = `<svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true"><rect x="1" y="1" width="52" height="52" rx="12" fill="var(--ink)"/><path d="M8 42 C 18 42, 22 12, 46 10" fill="none" stroke="var(--paper)" stroke-width="3.2" stroke-linecap="round"/><line x1="10" y1="35" x2="42" y2="15" stroke="var(--hi)" stroke-width="3.2" stroke-linecap="round"/><circle cx="25.6" cy="25.3" r="3.6" fill="var(--hi)"/></svg>`;

/* ---------- Shared pieces ---------- */
function meterHTML(ok, no, total, label) {
  return `<div class="meter" role="img" aria-label="${label}: ${ok} correct, ${no} missed, out of ${total}"><span class="g" style="width:${ok / total * 100}%"></span><span class="b" style="width:${no / total * 100}%"></span></div>`;
}
function tileHTML(q, opts = {}) {
  const st = statusOf(q.id);
  const fixed = st === 'ok' && everMissed(q.id);
  const mark = st === 'ok' ? '✓' : st === 'no' ? '✕' : '';
  const head = q.unit === 'u2' ? 'Day ' + q.day : q.code;
  const sub = opts.long ? (q.unit === 'u2' ? 'Unit 2' : UNAME[q.unit] + ' · Test ' + q.set) : (q.unit === 'u2' ? q.match.replace('Test ', '') : (q.calc ? 'Calculator' : q.calc === false ? 'No calculator' : ''));
  return `<button class="tile ${st} ${opts.up ? 'up' : ''}" data-go="${q.id}" data-seq="${opts.seq || seqOf(q)}" aria-label="${longName(q)}: ${esc(q.short)}${st === 'ok' ? (fixed ? ', fixed on retry' : ', correct') : st === 'no' ? ', missed' : ''}">
    <span class="d">${head}</span><span class="t">${q.short}</span>${sub ? `<span class="t">${sub}</span>` : ''}${mark ? `<span class="s" aria-hidden="true">${mark}</span>` : ''}</button>`;
}
function saveSectionHTML() {

/* ---------- Home ---------- */
function renderHome() {
  const tab = curTab();
  let h = `<header class="mast">${LOGO}<h1 class="wordmark">The Daily Derivative<small>AP Calculus AB practice, written the way the tests ask it.</small></h1></header>`;
  const missedCount = Object.keys(store.a).filter(id => BYID[id] && everMissed(id)).length;
  const tabs = [['u4', 'Unit 4 Test Sprint'], ['u3', 'Unit 3 Test Sprint'], ['u2', 'Unit 2 Daily'], ['review', 'Final Review' + (missedCount ? ` (${missedCount})` : '')]];

function homeU2() {
  const done = Q.filter(q => statusOf(q.id) !== 'new').length;
  const ok = Q.filter(q => statusOf(q.id) === 'ok').length;
  const no = done - ok;
  const nd = nextDay();
  let h = '<section class="next">';
  if (nd) {
    const q = Q[nd - 1];
    const isRetry = statusOf(q.id) === 'no';
    h += `<h2>${isRetry ? 'Try again: ' : 'Up next: '}Day ${nd}</h2><p>${q.topic}. Matches ${q.match} on the Unit 2 study guide.</p>`;
    h += `<button class="btn" data-go="${q.id}" data-seq="u2">${isRetry ? 'Retry' : 'Start'} Day ${nd}</button>`;
  } else {
    h += `<h2>All 30 days correct</h2><p>You’ve worked every question type on the Unit 2 Test. Revisit any day below to practice again.</p>`;
  }
  h += meterHTML(ok, no, 30, 'Unit 2');
  h += `<div class="meter-label">${ok} correct · ${no} to retry · ${30 - done} not started</div></section>`;
  h += saveSectionHTML();

  const filters = [['all', 'All days'], ['mc', 'Multiple choice'], ['frq1', 'Free response 1'], ['frq2', 'Free response 2 (table)'], ['todo', 'Not done'], ['miss', 'To retry']];
  h += '<h2 class="sec-h">All 30 days</h2><div class="filters" role="group" aria-label="Filter days">';
  filters.forEach(([k, lab]) => { h += `<button class="chip" data-filter="${k}" aria-pressed="${view.filter === k}">${lab}</button>`; });
  h += '</div><div class="grid">';
  const list = Q.filter(q => {
    const f = view.filter, st = statusOf(q.id);
    if (f === 'all') return true;
    if (f === 'todo') return st === 'new';
    if (f === 'miss') return st === 'no';
    return q.group === f;
  });
  list.forEach(q => { h += tileHTML(q, { up: q.day === nd }); });
  if (!list.length) h += '<p class="empty">Nothing here yet. Choose “All days” to see every question.</p>';
  h += '</div>';
  h += `<section class="howto"><h3>How it works</h3>
    <p>Each day is one question modeled on an item from the Unit 2 Test study guide. Before answering, open <b>“What is this question really asking?”</b> if the wording throws you. After you submit, you’ll see the full step-by-step solution and the trap most students fall into.</p>
    <p>For write-in answers, you don’t need to simplify: <b>(16−4)/4</b>, <b>-14/16</b>, and <b>y+2 = -1(x-1)</b> are all accepted.</p></section>`;
  return h;
}

const TEST_CFG = {
  u3: { intro: 'in the same order as the Unit 3 Test: multiple choice 1–7, then free response 8, 10 and 11 (calculator allowed on 10 and 11).',
    plan: `<p>Take Test A first, in order, like the real test. After each question you’ll see the full solution and the trap that catches most students.</p>
    <p>For every question you miss, the button under the solution takes you to its <b>twin</b> in Test B: the same skill with different numbers and wording. Getting the twin right is how you know you’ve got it.</p>
    <p>Have a calculator in <b>radian mode</b> for questions 10 and 11. Write-in answers don’t need simplifying: <b>1/5</b>, <b>8+5sin(2)</b>, and <b>y-3 = 2(x-1)</b> all work.</p>` },
  u4: { intro: 'in the same order as the Unit 4 Test: multiple choice 1–5 (calculator on 1–3), then free response 6–9 (calculator only on 9).',
    plan: `<p>Take Test A first, in order, like the real test. After each question you’ll see the full solution, the trap that catches most students, and for free response, the exact sentence to write for full credit.</p>
    <p>For every question you miss, the button under the solution takes you to its <b>twin</b> in Test B: the same skill with different numbers and wording.</p>
    <p>Know every derivative rule cold, and have your calculator in <b>radian mode</b> for MC 1–3 and FRQ 9. Practice its derivative function (nDeriv) on MC 3 and FRQ 9c. For the velocity graph questions (FRQ 8a–c), pick an answer for every row of the chart.</p>` }
};
function testNext(u) {
  const A = SEQ[u + 'A'].map(id => BYID[id]), B = SEQ[u + 'B'].map(id => BYID[id]);
  const aNew = A.find(q => statusOf(q.id) === 'new');
  if (aNew) return { q: aNew, kind: 'A' };
  const twinTodo = A.filter(q => everMissed(q.id)).map(q => BYID[q.twin]).find(t => statusOf(t.id) === 'new');
  if (twinTodo) return { q: twinTodo, kind: 'twin' };
  const bNew = B.find(q => statusOf(q.id) === 'new');
  if (bNew) return { q: bNew, kind: 'B' };
  const miss = [...A, ...B].find(q => statusOf(q.id) === 'no');
  if (miss) return { q: miss, kind: 'retry' };
  return null;
}
function homeTest(u) {
  const A = SEQ[u + 'A'].map(id => BYID[id]), B = SEQ[u + 'B'].map(id => BYID[id]);
  const cfg = TEST_CFG[u];
  const cnt = arr => ({ ok: arr.filter(q => statusOf(q.id) === 'ok').length, no: arr.filter(q => statusOf(q.id) === 'no').length });
  const a = cnt(A), b = cnt(B), n = A.length;
  const firstScoreA = A.filter(q => { const r = recOf(q.id); if (!r) return false; const first = (r.hist && r.hist.length) ? r.hist[0] : r; return first.correct; }).length;
  const nx = testNext(u);
  let h = '<section class="next">';
  if (!nx) {
    h += `<h2>Both practice tests correct</h2><p>You’re ready. Check Final Review for anything you missed along the way.</p>`;
  } else if (nx.kind === 'A') {
    const started = a.ok + a.no > 0;
    h += `<h2>${started ? 'Keep going: Test A · ' + nx.q.code : 'Start with Practice Test A'}</h2>`;
    h += `<p>${n} questions ${cfg.intro} Every miss links to a matching “twin” question in Test B.</p>`;
    h += `<button class="btn" data-go="${nx.q.id}" data-seq="${u}A">${started ? 'Continue' : 'Start Test A'}</button>`;
  } else {
    const tw = nx.kind === 'twin' ? BYID[nx.q.twin] : null;
    h += `<h2>Test A: ${firstScoreA} of ${n} on the first try</h2>`;
    if (nx.kind === 'twin') h += `<p>Next, fix what you missed. You missed <b>${tw.code}</b> (${tw.short}), so practice its twin in Test B.</p><button class="btn" data-go="${nx.q.id}" data-seq="${u}B">Practice Test B · ${nx.q.code}</button>`;
    else if (nx.kind === 'B') h += `<p>Every miss has been practiced. Take the rest of Test B as a second full practice run.</p><button class="btn" data-go="${nx.q.id}" data-seq="${u}B">Continue with Test B · ${nx.q.code}</button>`;
    else h += `<p>One more try on the questions still marked wrong.</p><button class="btn" data-go="${nx.q.id}" data-seq="${seqOf(nx.q)}">Retry ${titleOf(nx.q)}</button>`;
  }
  h += `<div class="meters2"><div><div class="meter-label">Test A</div>${meterHTML(a.ok, a.no, n, 'Test A')}<div class="meter-label">${a.ok} correct · ${a.no} to retry · ${n - a.ok - a.no} not started</div></div>`;
  h += `<div><div class="meter-label">Test B</div>${meterHTML(b.ok, b.no, n, 'Test B')}<div class="meter-label">${b.ok} correct · ${b.no} to retry · ${n - b.ok - b.no} not started</div></div></div>`;
  h += '</section>';
  h += saveSectionHTML();
  const upId = nx ? nx.q.id : null;
  h += `<h2 class="sec-h">Practice Test A</h2><div class="grid">${A.map(q => tileHTML(q, { up: q.id === upId })).join('')}</div>`;
  h += `<h2 class="sec-h">Practice Test B <span class="sec-note">same skills, new numbers and wording</span></h2><div class="grid">${B.map(q => tileHTML(q, { up: q.id === upId })).join('')}</div>`;
  h += `<section class="howto"><h3>Tonight’s plan</h3>${cfg.plan}</section>`;
  return h;
}

function homeReview() {
  const all = [...Q, ...U3, ...U4];
  const missedIds = all.filter(q => everMissed(q.id));
  const still = missedIds.filter(q => statusOf(q.id) === 'no');
  const fixed = missedIds.filter(q => statusOf(q.id) === 'ok');
  let h = '<section class="next">';
  h += `<h2>Final Review</h2><p>Every question you’ve missed in any unit stays here for the final, along with your earlier answers and the full solution.</p>`;
  if (still.length) h += `<button class="btn" data-go="${still[0].id}" data-seq="review">Review ${still.length} still missed</button>`;
  else if (fixed.length) h += `<button class="btn" data-go="${fixed[0].id}" data-seq="review">Look back at ${fixed.length} fixed question${fixed.length === 1 ? '' : 's'}</button>`;
  h += `<div class="meter-label" style="margin-top:12px">${still.length} still missed · ${fixed.length} fixed on a retry</div></section>`;
  h += saveSectionHTML();
  if (!missedIds.length) {
    h += '<p class="empty" style="margin-top:20px">Nothing here yet. Questions you miss in Units 2, 3 or 4 will collect here automatically, even after you fix them.</p>';
    return h;
  }
  const group = (title, list, note) => {
    if (!list.length) return '';
    let g = `<h2 class="sec-h">${title} <span class="sec-note">${note}</span></h2>`;
    ['u4', 'u3', 'u2'].forEach(u => {
      const sub = list.filter(q => q.unit === u);
      if (sub.length) g += `<h3 class="sub-h">${UNAME[u]}</h3><div class="grid">${sub.map(q => tileHTML(q, { long: true, seq: 'review' })).join('')}</div>`;
    });
    return g;
  };
  h += group('Still missed', still, 'work on these first');
  h += group('Fixed on a retry', fixed, 'worth one more look before the final');
  return h;
}

function reviewList() {
  const all = [...U4, ...U3, ...Q].filter(q => everMissed(q.id));
  return [...all.filter(q => statusOf(q.id) === 'no'), ...all.filter(q => statusOf(q.id) === 'ok')].map(q => q.id);
}

function wireHome() {
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => openQ(b.dataset.go, b.dataset.seq));
  app.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { view.filter = b.dataset.filter; renderHome(); });
  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { store.tab = b.dataset.tab; save(); renderHome(); });
  const setMsg = t => { const m = document.getElementById('fileMsg'); if (m) m.textContent = t; };
  document.getElementById('saveFile').onclick = saveProgressFile;
  const fileIn = document.getElementById('fileIn');
  document.getElementById('loadFile').onclick = () => fileIn.click();
  fileIn.onchange = async () => {
    const f = fileIn.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!d || d.app !== 'daily-derivative' || typeof d.a !== 'object') throw 0;
      const n = mergeProgress(d.a);
      renderHome(); flashSync(`Loaded “${f.name}” (${n} question${n === 1 ? '' : 's'} of work).`);
    } catch (e) { setMsg('That isn’t a Daily Derivative progress file. Choose the file named daily-derivative-progress.json.'); }
  };
  document.getElementById('mk').onclick = () => {
    const out = document.getElementById('codeOut');
    out.value = 'DD2-' + btoa(unescape(encodeURIComponent(JSON.stringify({ a: store.a }))));
    out.hidden = false; out.focus(); out.select();
  };
  document.getElementById('ld').onclick = () => {
    try {
      const raw = document.getElementById('codeIn').value.trim().replace(/^DD2-/, '');
      const data = JSON.parse(decodeURIComponent(escape(atob(raw))));
      if (!data || typeof data.a !== 'object') throw 0;
      const n = mergeProgress(data.a);
      renderHome(); flashSync(`Progress code loaded (${n} question${n === 1 ? '' : 's'} of work).`);
    } catch (e) { setMsg('That code didn’t work. Copy the whole code, including “DD2-”.'); }
  };
  document.getElementById('rs').onclick = () => {
    if (confirm('Clear all of your answers on this device?')) { store = { a: {}, tab: store.tab }; save(); renderHome(); }
  };
}

/* ---------- Progress file ---------- */
function flashSync(text) {
  const m = document.getElementById('fileMsg'); if (m) m.textContent = text;
  const sec = document.getElementById('sync'); if (sec) sec.scrollIntoView({ block: 'nearest' });
}
// Combine a loaded file with this device's answers; the more recent answer for each question wins.
function mergeProgress(incoming) {
  let keptLocal = 0;
  const merged = {};
  const ids = new Set([...Object.keys(store.a), ...Object.keys(incoming)]);
  ids.forEach(k => {
    const r = incoming[k], cur = store.a[k];
    const rOk = r && typeof r.correct === 'boolean';
    if (rOk && (!cur || (r.at || 0) >= (cur.at || 0))) merged[k] = r;
    else if (cur) { merged[k] = cur; if (rOk || !r) keptLocal += (cur.at || 0) > ((r && r.at) || 0) ? 1 : 0; }
  });
  store.a = merged;
  store.dirty = keptLocal;
  store.savedAt = store.savedAt || Date.now();
  save();
  return Object.keys(incoming).length;
}
async function saveProgressFile() {
  const data = JSON.stringify({ app: 'daily-derivative', v: 2, savedAt: new Date().toISOString(), a: store.a });
  const name = 'daily-derivative-progress.json';
  let downloads = null;
  try { downloads = window.claude ? await window.claude.use('downloads') : null; } catch (e) { downloads = null; }
  try {
    if (downloads) {
      await downloads.save({ filename: name, data });
    } else if (window.showSaveFilePicker && window.self === window.top) {
      const handle = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: 'Daily Derivative progress', accept: { 'application/json': ['.json'] } }] });
      const w = await handle.createWritable(); await w.write(data); await w.close();
    } else {
      const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }
    store.savedAt = Date.now(); store.dirty = 0; save();
    renderHome(); flashSync(`Saved “${name}”. Keep it in your Google Drive so you can load it anywhere.`);
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    const code = e && e.code;
    if (code === 'declined') { flashSync('Save canceled. Your answers are still here in this browser.'); return; }
    if (code === 'rate_limited') { flashSync('A save prompt is already open. Finish that one, then try again.'); return; }
    flashSync('The file couldn’t be saved on this device. Use “Other options” to copy a progress code instead.');
  }
}

/* ============================================================
   Answer checking for each question type
   ============================================================ */
function grade(q, resp) {
  // returns { correct, note?, cells? }
  if (q.type === 'mc') return { correct: resp === q.ans };
  if (q.type === 'num') {
    const v = readNumber(resp.v != null ? resp.v : resp);
    const numOk = q.tol ? Math.abs(v - q.answer) <= q.tol : close(v, q.answer);
    if (!q.units) return { correct: numOk };
    const unitOk = resp.u === q.unitAns;
    let note = '';
    if (numOk && !unitOk) note = 'Your number is right, but the units aren’t. On the test that costs a point.';
    if (!numOk && unitOk) note = 'Your units are right; the number isn’t.';
    return { correct: numOk && unitOk, note };
  }
  if (q.type === 'table') {
    const cells = [];
    let all = true;
    q.cells.forEach((row, r) => row.forEach((ans, c) => {
      const raw = resp[r * 4 + c] || '';
      let ok = false;
      try { ok = raw.trim() !== '' && close(readNumber(raw), ans); } catch (e) { ok = false; }
      cells.push(ok); if (!ok) all = false;
    }));
    return { correct: all, cells };
  }
  if (q.type === 'classify') {
    const cells = q.rows.map((r, i) => resp[i] === r[1]);
    return { correct: cells.every(Boolean), cells };
  }
  if (q.type === 'expr') {
    let s = resp.trim();
    if (!s) throw new Error('Type an answer first');
    if (s.includes('=')) s = s.slice(s.lastIndexOf('=') + 1);
    const f = compile(s);
    const ok = [0.4, 1.3, 2.7, 3.6].every(t => { const v = f({ t, x: NaN, y: NaN }); return close(v, q.exprF(t)); });
    return { correct: ok };
  }
  return { correct: checkAnswer(q, resp) };
}
function respText(q, resp) {
  if (resp == null) return '';
  if (q.type === 'mc') return 'ABCD'[resp];
  if (q.type === 'num' && q.units) return (resp.v || '') + ' ' + (resp.u || '(no units)');
  if (q.type === 'table') return 'table';
  if (q.type === 'classify') return 'chart';
  return String(resp);
}

/* ---------- Question view ---------- */
function openQ(id, seq) {
  const q = BYID[id];
  seq = seq || seqOf(q);
  const list = seq === 'review' ? reviewList() : SEQ[seq];
  view = { name: 'q', id, seq, list: list.includes(id) ? list : [id], filter: view.filter };
  renderQ(); window.scrollTo(0, 0);
}
function backHome() {
  if (view.seq === 'review') store.tab = 'review';
  else store.tab = view.seq.slice(0, 2);
  save();
  view = { name: 'home', filter: view.filter }; renderHome(); window.scrollTo(0, 0);
}

function invTableHTML(q, resp, cells, locked) {
  const labels = INV_LABELS;
  let h = '<div class="tbl-wrap"><table class="vals fill"><caption>Table for \\(f^{-1}\\)</caption><tbody>';
  for (let r = 0; r < 3; r++) {
    h += `<tr><th scope="row">${labels[r]}</th>`;
    for (let c = 0; c < 4; c++) {
      const i = r * 4 + c;
      const val = resp ? (resp[i] || '') : '';
      const cls = cells ? (cells[i] ? 'right' : 'wrong') : '';
      h += `<td class="${cls}"><input class="cell" data-i="${i}" aria-label="Row ${r + 1}, column ${c + 1}" value="${esc(val)}" ${locked ? 'disabled' : ''} autocomplete="off" spellcheck="false">`;
      if (cells && !cells[i]) h += `<span class="cell-ans">\\(${q.cellTex[r][c]}\\)</span>`;
      h += '</td>';
    }
    h += '</tr>';
  }
  return h + '</tbody></table></div>';
}

function classifyHTML(q, resp, cells, locked) {
  let h = '<div class="tbl-wrap"><table class="vals fill cls"><thead><tr><th scope="col">Time</th><th scope="col">Your answer</th></tr></thead><tbody>';
  q.rows.forEach(([lab, ans], i) => {
    const val = resp ? (resp[i] || '') : '';
    const cls = cells ? (cells[i] ? 'right' : 'wrong') : '';
    h += `<tr><th scope="row">${lab}</th><td class="${cls}"><select class="csel" data-i="${i}" aria-label="Answer for row ${i + 1}" ${locked ? 'disabled' : ''}><option value="">Choose…</option>`;
    q.opts.forEach(([k, txt]) => { h += `<option value="${k}" ${k === val ? 'selected' : ''}>${txt}</option>`; });
    h += '</select>';
    if (cells && !cells[i]) h += `<span class="cell-ans">Correct: ${q.opts.find(o => o[0] === ans)[1]}</span>`;
    h += '</td></tr>';
  });
  return h + '</tbody></table></div>';
}

function renderQ() {
  const q = BYID[view.id];
  const rec = recOf(q.id);
  const isRetry = retrying.has(q.id);
  const locked = !!rec && !isRetry;
  const pos = view.list.indexOf(q.id);
  const prevId = pos > 0 ? view.list[pos - 1] : null;
  const nextId = pos >= 0 && pos < view.list.length - 1 ? view.list[pos + 1] : null;
  const backLabel = view.seq === 'review' ? 'Final Review' : (q.unit === 'u2' ? 'All days' : UNAME[q.unit]);
  const navName = id => { const t = BYID[id]; return view.seq === 'review' ? 'Next missed' : (t.unit === 'u2' ? 'Day ' + t.day : t.code); };

  let h = `<nav class="topbar" aria-label="Question navigation">
    <button class="iconbtn" id="home">← ${backLabel}</button><span class="spacer"></span>
    <button class="iconbtn" id="prev" ${prevId ? '' : 'disabled'} aria-label="Previous question">‹ ${prevId && view.seq !== 'review' ? navName(prevId) : 'Prev'}</button>
    <button class="iconbtn" id="next" ${nextId ? '' : 'disabled'} aria-label="Next question">${nextId && view.seq !== 'review' ? navName(nextId) : 'Next'} ›</button></nav>`;
  h += `<article class="qcard"><div class="qhead"><h2>${titleOf(q)}</h2>`;
  if (view.seq === 'review') h += `<span class="unit-chip">${UNAME[q.unit]}</span>`;
  h += `<span class="match">${q.unit !== 'u2' ? UNAME[q.unit] + ' ' : ''}${q.match}: ${q.topic}</span>`;
  if (q.calc === true) h += `<span class="calc">Calculator allowed</span>`;
  if (q.calc === false) h += `<span class="calc no">No calculator</span>`;
  h += '</div>';
  h += `<div class="prompt">${q.prompt.replace('{TABLE}', tableHTML(null))}</div>`;
  if (q.graph) h += `<figure>${graphSVG(q.graph)}<figcaption>${q.graph.caption}</figcaption></figure>`;
  h += `<details class="decode"><summary>What is this question really asking?</summary><div>${q.decode}</div></details>`;

  // Earlier attempts (retry history)
  const hist = rec ? [...(rec.hist || []), ...(isRetry ? [rec] : [])] : [];
  if (hist.length) {
    h += `<div class="history"><b>${isRetry ? 'Your earlier attempts' : 'Earlier attempts'}</b><ul>`;
    hist.forEach((a, i) => {
      const when = a.at ? new Date(a.at).toLocaleDateString([], { month: 'short', day: 'numeric' }) : '';
      h += `<li class="${a.correct ? 'ok' : 'no'}"><span aria-hidden="true">${a.correct ? '✓' : '✕'}</span> Attempt ${i + 1}${when ? ' (' + when + ')' : ''}: ${q.type === 'table' || q.type === 'classify' ? (a.correct ? (q.type === 'table' ? 'table' : 'chart') + ' correct' : (q.type === 'table' ? 'table' : 'chart') + ' had mistakes') : 'answered <b>' + esc(respText(q, a.resp)) + '</b>'}</li>`;
    });
    h += '</ul></div>';
  }

  const shown = locked ? rec.resp : draft[q.id];
  let graded = null;
  if (locked) { try { graded = grade(q, rec.resp); } catch (e) { graded = { correct: rec.correct }; } }

  if (q.type === 'mc') {
    h += '<div class="choices" role="group" aria-label="Answer choices">';
    q.choices.forEach((c, i) => {
      let cls = '';
      if (locked) { if (i === q.ans) cls = 'right'; else if (i === shown) cls = 'wrong'; }
      h += `<button class="choice ${cls}" data-i="${i}" aria-pressed="${!locked && shown === i}" ${locked ? 'disabled' : ''}><span class="L">${'ABCD'[i]}</span><span class="body">${c}</span></button>`;
    });
    h += '</div>';
  } else if (q.type === 'classify') {
    h += classifyHTML(q, shown, locked ? graded.cells : null, locked);
  } else if (q.type === 'table') {
    h += invTableHTML(q, shown, locked ? graded.cells : null, locked);
    h += `<p class="note">Fractions like 1/4 are fine. Use - for negatives.</p>`;
  } else {
    const val = q.type === 'num' && q.units ? (shown ? shown.v : '') : (shown || '');
    const help = q.help || (q.type === 'line'
      ? 'Any correct form works, e.g. y - 3 = 2(x - 5). No need to simplify.'
      : 'Fractions like -14/16 are fine. Use sqrt(3) and pi if needed. No need to simplify.');
    h += `<div class="field"><label for="ans">${q.label || 'Your answer:'}</label>`;
    if (q.units) {
      const u = shown ? shown.u : '';
      h += `<div class="with-units"><input id="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(val)}" ${locked ? 'disabled' : ''}>
        <select id="unit" aria-label="Units" ${locked ? 'disabled' : ''}><option value="">Units…</option>${q.units.map(o => `<option ${o === u ? 'selected' : ''}>${o}</option>`).join('')}</select></div>`;
    } else {
      h += `<input id="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(val)}" ${locked ? 'disabled' : ''}>`;
    }
    h += `<div class="help">${help}</div><div class="reads" id="reads" aria-live="polite"></div></div>`;
  }

  if (!locked) {
    h += `<div class="actions"><button class="btn" id="submit">Submit answer</button>${isRetry ? '<button class="btn ghost" id="cancelRetry">Cancel</button>' : ''}<span class="note" id="err" role="alert"></span></div>`;
  } else {
    const ok = rec.correct;
    h += `<div class="verdict ${ok ? 'ok' : 'no'}" role="status"><strong class="big">${ok ? 'Correct!' : 'Not quite.'}</strong>
      ${q.type !== 'mc' && q.type !== 'table' && q.type !== 'classify' ? `<div>Your answer: <b>${esc(respText(q, rec.resp))}</b></div>` : ''}
      ${graded && graded.note ? `<div class="vnote">${graded.note}</div>` : ''}
      <div class="ans">Correct answer: ${q.ansTex}${q.units ? '' : ''}</div></div>`;
    h += '<section class="solution"><h3>Step-by-step solution</h3>';
    if (q.table) h += tableHTML(q.table);
    h += '<ol class="steps">';
    q.steps.forEach((s, i) => { h += `<li class="${i === q.steps.length - 1 ? 'final' : ''}">${s}</li>`; });
    h += `</ol><div class="trap"><b>Test trap</b>${q.trap}</div></section>`;
    const twin = q.twin ? BYID[q.twin] : null;
    let twinBtn = '';
    if (twin && !ok) {
      const tSt = statusOf(twin.id);
      twinBtn = `<button class="btn twin" id="go-twin">${q.set === 'A' ? 'Practice the twin' : 'See the matching question'}: Test ${twin.set} · ${twin.code}${tSt === 'ok' ? ' ✓' : ''}</button>`;
    }
    h += `<div class="actions" style="margin-top:18px">${twinBtn}
      ${nextId ? `<button class="btn ${twinBtn ? 'ghost' : ''}" id="go-next">${view.seq === 'review' ? 'Next in review' : 'Go to ' + navName(nextId)}</button>` : `<button class="btn ${twinBtn ? 'ghost' : ''}" id="home2">Back to ${backLabel}</button>`}
      <button class="btn ghost" id="retry">Try this one again</button></div>`;
  }
  h += '</article>';
  app.innerHTML = h;

  document.getElementById('home').onclick = backHome;
  document.getElementById('prev').onclick = () => { if (prevId) openQ(prevId, view.seq); };
  document.getElementById('next').onclick = () => { if (nextId) openQ(nextId, view.seq); };

  if (!locked) {
    if (q.type === 'mc') {
      app.querySelectorAll('.choice').forEach(b => b.onclick = () => {
        draft[q.id] = +b.dataset.i;
        app.querySelectorAll('.choice').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        document.getElementById('err').textContent = '';
      });
    } else if (q.type === 'classify') {
      const sels = [...app.querySelectorAll('.csel')];
      sels.forEach(s => s.onchange = () => { draft[q.id] = sels.map(x => x.value); document.getElementById('err').textContent = ''; });
    } else if (q.type === 'table') {
      const cellsEls = [...app.querySelectorAll('.cell')];
      const upd = () => { draft[q.id] = cellsEls.map(c => c.value); };
      cellsEls.forEach(c => { c.oninput = upd; c.onkeydown = e => { if (e.key === 'Enter') submit(); }; });
    } else {
      const inp = document.getElementById('ans'), reads = document.getElementById('reads');
      const sel = document.getElementById('unit');
      const upd = () => {
        draft[q.id] = q.units ? { v: inp.value, u: sel.value } : inp.value;
        const p = previewText(q, inp.value); reads.textContent = p.t; reads.className = 'reads' + (p.err ? ' err' : '');
      };
      inp.oninput = upd; if (sel) sel.onchange = upd; upd();
      inp.onkeydown = e => { if (e.key === 'Enter') submit(); };
    }
    document.getElementById('submit').onclick = submit;
    const cr = document.getElementById('cancelRetry');
    if (cr) cr.onclick = () => { retrying.delete(q.id); delete draft[q.id]; renderQ(); };
  } else {
    document.getElementById('retry').onclick = () => { retrying.add(q.id); delete draft[q.id]; renderQ(); };
    const gn = document.getElementById('go-next'); if (gn) gn.onclick = () => openQ(nextId, view.seq);
    const h2 = document.getElementById('home2'); if (h2) h2.onclick = backHome;
    const gt = document.getElementById('go-twin'); if (gt) gt.onclick = () => openQ(q.twin, seqOf(BYID[q.twin]));
  }

  function submit() {
    const err = document.getElementById('err');
    let resp, result;
    if (q.type === 'mc') {
      resp = draft[q.id];
      if (resp == null) { err.textContent = 'Choose an answer first.'; return; }
    } else if (q.type === 'classify') {
      resp = [...app.querySelectorAll('.csel')].map(s => s.value);
      if (resp.some(v => !v)) { err.textContent = 'Choose an answer for every row first.'; return; }
    } else if (q.type === 'table') {
      resp = [...app.querySelectorAll('.cell')].map(c => c.value);
      if (resp.some(v => !v.trim())) { err.textContent = 'Fill in every cell of the table first.'; return; }
      const bad = resp.findIndex(v => { try { readNumber(v); return false; } catch (e) { return true; } });
      if (bad >= 0) { err.textContent = `Cell ${bad + 1} isn’t a number I can read.`; return; }
    } else if (q.units) {
      resp = { v: document.getElementById('ans').value, u: document.getElementById('unit').value };
      if (!resp.u) { try { readNumber(resp.v); } catch (e) { err.textContent = e.message + '.'; return; } err.textContent = 'Choose the units too.'; return; }
    } else {
      resp = document.getElementById('ans').value;
    }
    try { result = grade(q, resp); }
    catch (e) { err.textContent = e.message + '.'; return; }
    const prev = recOf(q.id);
    const hist = prev ? [...(prev.hist || []), { resp: prev.resp, correct: prev.correct, at: prev.at }] : [];
    store.a[q.id] = { resp, correct: result.correct, tries: (prev ? prev.tries || 1 : 0) + 1, at: Date.now(), hist };
    retrying.delete(q.id); delete draft[q.id];
    store.dirty = (store.dirty || 0) + 1;
    save(); renderQ();
    const v = app.querySelector('.verdict'); if (v) v.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  typesetApp();
}

renderHome();
</script>
