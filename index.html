<style>
:root {
  --bg: #e9f0f4;
  --grid-line: rgba(31, 95, 209, 0.07);
  --paper: #ffffff;
  --ink: #15233a;
  --muted: #56647a;
  --line: #d3dde6;
  --blue: #1f5fd1;
  --blue-soft: #e3ecfb;
  --hi: #ffd43b;
  --hi-soft: #fff3c2;
  --good: #1b7a4f;
  --good-soft: #dcf2e6;
  --bad: #b8382a;
  --bad-soft: #fbe2de;
  --axis: #7b8798;
  --plot-grid: #e6ecf2;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1724; --grid-line: rgba(120, 160, 230, 0.06); --paper: #172234; --ink: #e8eef7; --muted: #9eabbf;
    --line: #2b3a52; --blue: #7aa7ff; --blue-soft: #1d2f4f; --hi: #ffd43b; --hi-soft: #3a3415;
    --good: #5fd39c; --good-soft: #143326; --bad: #ff8a7a; --bad-soft: #3d1c19; --axis: #8b97a8; --plot-grid: #22314a;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1724; --grid-line: rgba(120, 160, 230, 0.06); --paper: #172234; --ink: #e8eef7; --muted: #9eabbf;
  --line: #2b3a52; --blue: #7aa7ff; --blue-soft: #1d2f4f; --hi: #ffd43b; --hi-soft: #3a3415;
  --good: #5fd39c; --good-soft: #143326; --bad: #ff8a7a; --bad-soft: #3d1c19; --axis: #8b97a8; --plot-grid: #22314a;
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55;
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 24px 24px;
  min-height: 100vh;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 64px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
mjx-container { max-width: 100%; overflow-x: auto; overflow-y: hidden; }
mjx-container[display="true"] { margin: 0.6em 0 !important; }

/* Masthead */
.mast { display: flex; align-items: center; gap: 14px; margin: 8px 0 22px; }
.mast svg { flex: none; }
.wordmark { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 6.5vw, 44px); line-height: 1; letter-spacing: -0.02em; margin: 0; }
.wordmark small { display: block; font-family: var(--body); font-weight: 400; font-size: 15px; letter-spacing: 0; color: var(--muted); margin-top: 6px; }

/* Up next */
.next {
  background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; padding: 20px;
  box-shadow: 6px 6px 0 var(--hi); margin-bottom: 26px;
}
.next h2 { font-family: var(--display); font-weight: 800; font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
.next p { margin: 0 0 14px; color: var(--muted); }
.meter { height: 12px; border-radius: 6px; background: var(--plot-grid); overflow: hidden; margin: 14px 0 6px; display: flex; }
.meter span { display: block; height: 100%; }
.meter .g { background: var(--good); } .meter .b { background: var(--bad); }
.meter-label { font-size: 14px; color: var(--muted); }

.btn { border: 2px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 10px; padding: 10px 18px; font-weight: 700; }
.btn:hover { filter: brightness(1.15); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* Section headings */
.sec-h { font-family: var(--display); font-weight: 600; font-size: 21px; margin: 28px 0 10px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 13px; font-size: 14px; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }

/* Day grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
.tile {
  text-align: left; background: var(--paper); border: 1.5px solid var(--line); border-radius: 10px;
  padding: 10px 12px 11px; display: flex; flex-direction: column; gap: 3px; position: relative; min-height: 86px;
}
.tile:hover { border-color: var(--ink); }
.tile .d { font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1.1; padding-right: 24px; }
.tile .t { font-size: 13px; color: var(--muted); line-height: 1.3; }
.tile .s { position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.tile.ok { border-color: var(--good); background: var(--good-soft); }
.tile.ok .s { background: var(--good); color: var(--paper); }
.tile.no { border-color: var(--bad); background: var(--bad-soft); }
.tile.no .s { background: var(--bad); color: var(--paper); }
.tile.up { border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--hi); }
.empty { color: var(--muted); padding: 10px 0; }

.howto { background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-top: 28px; }
.howto h3 { margin: 0 0 6px; font-family: var(--display); font-weight: 600; font-size: 18px; }
.howto p { margin: 6px 0; }
.howto textarea { width: 100%; min-height: 70px; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; border: 1.5px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.note { font-size: 14px; color: var(--muted); }
.sync-status { margin: 10px 0 4px; }
#sync { margin-top: 0; }
.sync-status .warn { color: var(--bad); font-weight: 700; }
details.more { margin-top: 14px; border-top: 1.5px solid var(--line); padding-top: 10px; }
details.more summary { cursor: pointer; font-weight: 700; color: var(--muted); }

/* Question view */
.topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.topbar .spacer { flex: 1; }
.iconbtn { border: 1.5px solid var(--line); background: var(--paper); border-radius: 9px; padding: 7px 12px; font-size: 15px; }
.iconbtn:hover { border-color: var(--ink); }
.iconbtn:disabled { opacity: 0.35; cursor: not-allowed; }
.qcard { background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; padding: 22px 20px; }
.qhead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.qhead h2 { font-family: var(--display); font-weight: 800; font-size: 30px; margin: 0; letter-spacing: -0.01em; }
.match { background: var(--hi-soft); border: 1.5px solid var(--hi); border-radius: 8px; padding: 3px 10px; font-size: 14px; font-weight: 700; }
.prompt { font-size: 18px; }
.prompt p { margin: 0 0 10px; }
figure { margin: 14px 0; }
figure svg { width: 100%; max-width: 420px; height: auto; display: block; margin: 0 auto; }
figcaption { text-align: center; font-size: 14px; color: var(--muted); margin-top: 4px; }
.tbl-wrap { overflow-x: auto; margin: 12px 0; }
table.vals { border-collapse: collapse; margin: 0 auto; min-width: 300px; }
table.vals th, table.vals td { border: 1.5px solid var(--line); padding: 7px 14px; text-align: center; }
table.vals th { background: var(--blue-soft); }
table.vals td.hl, table.vals th.hl { background: var(--hi-soft); }

details.decode { margin: 16px 0 6px; border: 1.5px dashed var(--blue); border-radius: 10px; padding: 0 14px; background: var(--blue-soft); }
details.decode summary { cursor: pointer; padding: 10px 0; font-weight: 700; color: var(--blue); }
details.decode div { padding: 0 0 12px; }

.choices { display: grid; gap: 10px; margin: 16px 0; }
.choice {
  display: flex; gap: 12px; align-items: center; text-align: left; width: 100%;
  border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--paper); min-height: 52px;
}
.choice:hover:not(:disabled) { border-color: var(--ink); }
.choice .L { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--ink); display: grid; place-items: center; font-weight: 700; }
.choice[aria-pressed="true"] { border: 2px solid var(--blue); background: var(--blue-soft); }
.choice[aria-pressed="true"] .L { background: var(--blue); border-color: var(--blue); color: var(--paper); }
.choice.right { border: 2px solid var(--good); background: var(--good-soft); }
.choice.right .L { background: var(--good); border-color: var(--good); color: var(--paper); }
.choice.wrong { border: 2px solid var(--bad); background: var(--bad-soft); }
.choice.wrong .L { background: var(--bad); border-color: var(--bad); color: var(--paper); }
.choice:disabled { cursor: default; }
.choice .body { flex: 1; min-width: 0; }

.field { margin: 16px 0; }
.field label { display: block; font-weight: 700; margin-bottom: 6px; }
.field input {
  width: 100%; font: 20px/1.3 var(--body); padding: 10px 12px; border: 2px solid var(--ink); border-radius: 10px;
  background: var(--paper); color: var(--ink);
}
.field input:disabled { opacity: 0.75; }
.field .help { font-size: 14px; color: var(--muted); margin-top: 6px; }
.field .reads { font-size: 14px; margin-top: 4px; min-height: 1.4em; color: var(--blue); }
.field .reads.err { color: var(--bad); }

.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 8px; }

.verdict { margin-top: 20px; border-radius: 12px; padding: 14px 16px; border: 2px solid; }
.verdict.ok { border-color: var(--good); background: var(--good-soft); }
.verdict.no { border-color: var(--bad); background: var(--bad-soft); }
.verdict strong.big { font-family: var(--display); font-size: 22px; display: block; margin-bottom: 4px; }
.verdict .ans { margin-top: 6px; }

.solution { margin-top: 18px; }
.solution h3 { font-family: var(--display); font-weight: 600; font-size: 20px; margin: 0 0 10px; }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
.steps li { counter-increment: s; position: relative; padding: 4px 0 14px 44px; border-left: 2px solid var(--line); margin-left: 15px; }
.steps li:last-child { border-left-color: transparent; }
.steps li::before {
  content: counter(s); position: absolute; left: -16px; top: 0; width: 30px; height: 30px; border-radius: 50%;
  background: var(--paper); border: 2px solid var(--ink); display: grid; place-items: center; font-weight: 700; font-size: 15px;
}
.steps li.final::before { background: var(--hi); border-color: var(--ink); color: #15233a; }
.trap { margin-top: 6px; border-left: 5px solid var(--hi); background: var(--hi-soft); border-radius: 0 10px 10px 0; padding: 10px 14px; }
.trap > b:first-child { display: block; }

@media (max-width: 520px) {
  body { font-size: 16px; }
  .qcard { padding: 18px 14px; }
  .prompt { font-size: 17px; }
}
@media (prefers-reduced-motion: no-preference) {
  .verdict { animation: pop 0.28s ease-out; }
  @keyframes pop { from { transform: scale(0.97); opacity: 0; } to { transform: none; opacity: 1; } }
}

/* Unit tabs */
.tabs { display: flex; gap: 6px; margin: 0 0 18px; padding: 5px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; overflow-x: auto; }
.tab { flex: 1 0 auto; border: 0; background: transparent; border-radius: 8px; padding: 9px 14px; font-weight: 700; font-size: 15px; color: var(--muted); white-space: nowrap; }
.tab:hover { color: var(--ink); background: var(--bg); }
.tab[aria-current="page"] { background: var(--ink); color: var(--paper); }
.meters2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 14px; }
.meters2 .meter { margin: 4px 0; }
.meters2 > div > .meter-label:first-child { font-weight: 700; color: var(--ink); }
@media (max-width: 520px) { .meters2 { grid-template-columns: 1fr; gap: 8px; } }
.sec-note { font-family: var(--body); font-weight: 400; font-size: 14px; color: var(--muted); margin-left: 6px; }
.sub-h { font-family: var(--display); font-weight: 600; font-size: 16px; margin: 14px 0 8px; color: var(--muted); }
.calc { border: 1.5px solid var(--line); border-radius: 8px; padding: 3px 10px; font-size: 14px; font-weight: 700; color: var(--blue); background: var(--blue-soft); }
.calc.no { color: var(--muted); background: var(--paper); }
.unit-chip { border: 1.5px solid var(--ink); border-radius: 8px; padding: 3px 10px; font-size: 14px; font-weight: 700; }
.history { margin: 14px 0 4px; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 15px; }
.history ul { list-style: none; margin: 4px 0 0; padding: 0; }
.history li { margin: 2px 0; }
.history li.ok span { color: var(--good); font-weight: 700; }
.history li.no span { color: var(--bad); font-weight: 700; }
.with-units { display: flex; gap: 8px; }
.with-units input { flex: 1; min-width: 0; }
.with-units select { font: 17px var(--body); border: 2px solid var(--ink); border-radius: 10px; padding: 0 10px; background: var(--paper); color: var(--ink); }
table.vals.fill caption { caption-side: top; font-size: 14px; color: var(--muted); padding-bottom: 6px; }
table.vals.fill td { padding: 5px; min-width: 64px; vertical-align: top; }
table.vals.fill td.right { background: var(--good-soft); }
table.vals.fill td.wrong { background: var(--bad-soft); }
.cell { width: 64px; font: 17px var(--body); text-align: center; padding: 6px 4px; border: 1.5px solid var(--ink); border-radius: 7px; background: var(--paper); color: var(--ink); }
.cell:disabled { opacity: 0.85; }
.cell-ans { display: block; font-size: 13px; color: var(--bad); margin-top: 3px; }
.vnote { margin-top: 6px; font-weight: 700; }
.csel { font: 16px var(--body); padding: 7px 8px; border: 1.5px solid var(--ink); border-radius: 7px; background: var(--paper); color: var(--ink); width: 100%; min-width: 150px; }
.csel:disabled { opacity: 0.85; }
table.vals.cls td { text-align: left; }
table.vals.cls th[scope="row"] { white-space: nowrap; }
.btn.twin { background: var(--hi); border-color: var(--ink); color: #15233a; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============================================================
   THE DAILY DERIVATIVE — AP Calculus AB test prep
   Unit 2: 30 daily questions · Units 3 and 4: two matched practice tests each
   ============================================================ */
const T = String.raw;

/* ---------- Shared table (matches FRQ 2 format) ---------- */
const TABLE = { x: [1, 2, 3, 4], f: [3, -2, 5, 1], fp: [-1, 4, 2, -3], g: [2, 6, -1, 4], gp: [5, -3, 1, 2] };
function tableHTML(hlCol) {
  const rows = [['\\(x\\)', 'x'], ['\\(f(x)\\)', 'f'], ['\\(f\'(x)\\)', 'fp'], ['\\(g(x)\\)', 'g'], ['\\(g\'(x)\\)', 'gp']];
  let h = '<div class="tbl-wrap"><table class="vals"><tbody>';
  for (const [lab, k] of rows) {
    h += '<tr><th scope="row">' + lab + '</th>';
    TABLE[k].forEach((v, i) => {
      const cls = (hlCol != null && TABLE.x[i] === hlCol) ? ' class="hl"' : '';
      h += k === 'x' ? '<th' + cls + '>' + v + '</th>' : '<td' + cls + '>' + v + '</td>';
    });
    h += '</tr>';
  }
  return h + '</tbody></table></div>';
}

/* ---------- Graph specs ---------- */
const GRAPH_DIFF = {
  xmin: -5, xmax: 5, ymin: -3, ymax: 5,
  curves: [
    { f: x => 1 - (x + 2), a: -5, b: -2 },
    { f: x => 1 + (x + 2) * (x + 2) / 3, a: -2, b: 1 },
    { f: x => 1 + 1.5874 * Math.cbrt(x - 3), a: 1, b: 5 }
  ],
  closed: [[1, 4]], open: [[1, -1]], asym: [],
  caption: 'Graph of f for −5 ≤ x ≤ 5'
};
const GRAPH_UNDEF = {
  xmin: -5, xmax: 5, ymin: -5, ymax: 5,
  curves: [
    { f: x => 3 / (x + 1) + 1, a: -5, b: -1.0001 },
    { f: x => 3 / (x + 1) + 1, a: -0.9999, b: 5 }
  ],
  closed: [[4, -2]], open: [[2, 2], [4, 1.6]], asym: [-1],
  caption: 'Graph of f for −5 ≤ x ≤ 5 (dashed line is a vertical asymptote)'
};

/* ---------- The 30 questions ---------- */
const Q = [
/* Day 1 */ {
  match: 'Test MC #1', topic: 'Product Rule', short: 'Product Rule',
  group: 'mc', type: 'mc',
  prompt: T`<p>Let \(h(x) = f(x)\cdot g(x)\). If \(f(2) = 3\), \(f'(2) = -1\), \(g(2) = 4\), and \(g'(2) = 5\), what is the value of \(h'(2)\)?</p>`,
  decode: T`<b>h</b> is two functions multiplied together, so this is a <b>Product Rule</b> question. You are not given formulas for f or g — only their values at x = 2. Write the Product Rule, then plug in numbers.`,
  choices: [T`\(-5\)`, T`\(11\)`, T`\(19\)`, T`\(7\)`], ans: 1, ansTex: T`\(h'(2) = 11\)`,
  steps: [
    T`Write the Product Rule: \(h'(x) = f'(x)\,g(x) + f(x)\,g'(x)\). <br>(“derivative of the first times the second, plus the first times derivative of the second”)`,
    T`Replace every \(x\) with 2: \(h'(2) = f'(2)\,g(2) + f(2)\,g'(2)\)`,
    T`Substitute the given values: \(h'(2) = (-1)(4) + (3)(5)\)`,
    T`Compute: \(-4 + 15 = 11\). <b>Answer: B</b>`
  ],
  trap: T`Choice A, \(-5\), is \(f'(2)\cdot g'(2)\). The derivative of a product is <i>not</i> the product of the derivatives.`
},
/* Day 2 */ {
  match: 'Test MC #8', topic: 'Identifying the definition of the derivative', short: "Definition of f'(x)",
  group: 'mc', type: 'mc',
  prompt: T`<p>Which of the following is equal to \(f'(x)\)?</p>`,
  decode: T`They want the <b>limit definition of the derivative</b> written correctly. Check three things in each choice: (1) is there a limit as \(h\to 0\)? (2) is the top “f of the new x minus f of the old x”? (3) is the bottom the change in x?`,
  choices: [
    T`\(\displaystyle\lim_{h\to 0}\frac{f(x+h)-f(x)}{h}\)`,
    T`\(\displaystyle\lim_{h\to 0}\frac{f(x+h)-f(h)}{h}\)`,
    T`\(\displaystyle\frac{f(x+h)-f(x)}{h}\)`,
    T`\(\displaystyle\lim_{h\to 0}\frac{f(x)+h-f(x)}{h}\)`
  ], ans: 0, ansTex: T`\(\displaystyle f'(x)=\lim_{h\to 0}\frac{f(x+h)-f(x)}{h}\)`,
  steps: [
    T`The derivative is the slope of a secant line as the two points get infinitely close. Slope = \(\dfrac{\text{change in } y}{\text{change in } x}\).`,
    T`The two points are \(\big(x, f(x)\big)\) and \(\big(x+h, f(x+h)\big)\). Change in y: \(f(x+h) - f(x)\). Change in x: \((x+h) - x = h\).`,
    T`Then let the gap shrink to zero: \(\displaystyle\lim_{h\to 0}\frac{f(x+h)-f(x)}{h}\). That matches <b>A</b>.`,
    T`Why the others fail: <b>B</b> subtracts \(f(h)\) instead of \(f(x)\). <b>C</b> has no limit — that is just the slope of a secant line (an average rate of change). <b>D</b> has \(f(x)+h\) instead of \(f(x+h)\); it simplifies to 1 every time. <b>Answer: A</b>`
  ],
  trap: T`Watch for <b>where the h goes</b>: \(f(x+h)\) means “plug \(x+h\) into f,” which is different from \(f(x)+h\).`
},
/* Day 3 */ {
  match: 'Test MC #4', topic: 'Properties of a tangent line', short: 'Tangent line facts',
  group: 'mc', type: 'mc',
  prompt: T`<p>The line tangent to the graph of \(f\) at \(x = -1\) has equation \(y = 4x + 7\). Which of the following must be true?</p>`,
  decode: T`A tangent line gives you <b>two</b> facts about f at the point of tangency: it <b>touches</b> the graph there (same y-value), and its <b>slope equals the derivative</b> there.`,
  choices: [
    T`\(f(-1) = 4\) and \(f'(-1) = 7\)`,
    T`\(f(-1) = 3\) and \(f'(-1) = 4\)`,
    T`\(f(-1) = 11\) and \(f'(-1) = 4\)`,
    T`\(f(-1) = 3\) and \(f'(-1) = 3\)`
  ], ans: 1, ansTex: T`\(f(-1) = 3\) and \(f'(-1) = 4\)`,
  steps: [
    T`<b>Property 1:</b> the tangent line touches the graph at \(x=-1\), so \(f(-1)\) equals the line’s y-value at \(x=-1\).`,
    T`Plug in: \(y = 4(-1) + 7 = 3\). So \(f(-1) = 3\).`,
    T`<b>Property 2:</b> the slope of the tangent line equals the derivative at the point. The slope of \(y = 4x+7\) is 4, so \(f'(-1) = 4\).`,
    T`Both facts together: <b>Answer: B</b>`
  ],
  trap: T`7 is the <i>y-intercept</i> of the line — it has nothing to do with \(f'\). And 11 comes from plugging in \(+1\) instead of \(-1\).`
},
/* Day 4 */ {
  match: 'Test FRQ 1(a)', topic: 'Average rate of change on a closed interval', short: 'Average rate of change',
  group: 'frq1', type: 'num',
  prompt: T`<p>Let \(f(x) = x^3 - 4x + 1\).</p><p>Find the <b>average rate of change</b> of \(f\) on the interval \([-1, 3]\).</p>`,
  decode: T`“Average rate of change” on an interval = the <b>slope between the two endpoints</b>. You do <b>not</b> take a derivative. Plug both endpoints into f, then use the slope formula.`,
  answer: 3, ansTex: T`\(3\)`, label: 'Average rate of change =',
  steps: [
    T`Average rate of change on \([a,b]\) is \(\dfrac{f(b)-f(a)}{b-a}\). Here \(a=-1\) and \(b=3\).`,
    T`\(f(3) = 3^3 - 4(3) + 1 = 27 - 12 + 1 = 16\)`,
    T`\(f(-1) = (-1)^3 - 4(-1) + 1 = -1 + 4 + 1 = 4\)`,
    T`\(\dfrac{f(3)-f(-1)}{3-(-1)} = \dfrac{16-4}{4} = \dfrac{12}{4} = 3\)`
  ],
  trap: T`If you took a derivative, you answered a different question (that’s <i>instantaneous</i> rate of change). Also watch the denominator: \(3-(-1) = 4\), not 2.`
},
/* Day 5 */ {
  match: 'Test MC #2', topic: 'Quotient Rule', short: 'Quotient Rule',
  group: 'mc', type: 'mc',
  prompt: T`<p>Let \(h(x) = \dfrac{f(x)}{g(x)}\). If \(f(3) = 4\), \(f'(3) = 2\), \(g(3) = -2\), and \(g'(3) = 1\), what is \(h'(3)\)?</p>`,
  decode: T`A function divided by a function → <b>Quotient Rule</b>. Order matters: the bottom function goes first in the numerator. “Low d-high minus high d-low, over low squared.”`,
  choices: [T`\(2\)`, T`\(0\)`, T`\(-2\)`, T`\(4\)`], ans: 2, ansTex: T`\(h'(3) = -2\)`,
  steps: [
    T`Quotient Rule: \(h'(x) = \dfrac{g(x)\,f'(x) - f(x)\,g'(x)}{\big[g(x)\big]^2}\)`,
    T`At \(x = 3\): \(h'(3) = \dfrac{g(3)\,f'(3) - f(3)\,g'(3)}{\big[g(3)\big]^2}\)`,
    T`Substitute: \(\dfrac{(-2)(2) - (4)(1)}{(-2)^2} = \dfrac{-4 - 4}{4}\)`,
    T`\(= \dfrac{-8}{4} = -2\). <b>Answer: C</b>`
  ],
  trap: T`Choice A (2) is what you get if you flip the order in the numerator. With the Quotient Rule, the <b>minus sign makes order matter</b> — always start with the bottom function.`
},
/* Day 6 */ {
  match: 'Test MC #6', topic: 'Trig derivatives at a radian value', short: 'Trig derivatives',
  group: 'mc', type: 'mc',
  prompt: T`<p>If \(f(x) = 3\sin x - 2\cos x\), then \(f'\!\left(\dfrac{\pi}{3}\right) =\)</p>`,
  decode: T`Two jobs: (1) take the derivative using the trig rules, (2) evaluate at \(\frac{\pi}{3}\) using the unit circle. Don’t plug in first — derivative first, then plug in.`,
  choices: [T`\(\dfrac{3}{2} + \sqrt{3}\)`, T`\(\dfrac{3}{2} - \sqrt{3}\)`, T`\(\dfrac{3\sqrt{3}}{2} + 1\)`, T`\(-\dfrac{3}{2} + \sqrt{3}\)`],
  ans: 0, ansTex: T`\(\dfrac{3}{2} + \sqrt{3}\)`,
  steps: [
    T`Rules: \(\dfrac{d}{dx}\sin x = \cos x\) and \(\dfrac{d}{dx}\cos x = -\sin x\).`,
    T`\(f'(x) = 3\cos x - 2(-\sin x) = 3\cos x + 2\sin x\)`,
    T`Unit circle: \(\cos\frac{\pi}{3} = \frac{1}{2}\) and \(\sin\frac{\pi}{3} = \frac{\sqrt{3}}{2}\).`,
    T`\(f'\!\left(\frac{\pi}{3}\right) = 3\cdot\frac{1}{2} + 2\cdot\frac{\sqrt{3}}{2} = \frac{3}{2} + \sqrt{3}\). <b>Answer: A</b>`
  ],
  trap: T`Choice B comes from forgetting that the derivative of cosine is <b>negative</b> sine. Minus times minus is plus.`
},
/* Day 7 */ {
  match: 'Test MC #3', topic: 'Piecewise: continuous and differentiable?', short: 'Piecewise functions',
  group: 'mc', type: 'mc',
  prompt: T`<p>Let \(f(x) = \begin{cases} x^2 + 1, & x \le 1 \\ 2x, & x > 1 \end{cases}\)</p><p>Which of the following is true about \(f\) at \(x = 1\)?</p>`,
  decode: T`Two separate tests at the “break point” x = 1. <b>Continuous?</b> → do the pieces give the same <i>y-value</i>? <b>Differentiable?</b> → do the pieces give the same <i>slope</i> (derivative)? You need both to be differentiable.`,
  choices: [
    T`\(f\) is neither continuous nor differentiable at \(x=1\)`,
    T`\(f\) is continuous but not differentiable at \(x=1\)`,
    T`\(f\) is differentiable but not continuous at \(x=1\)`,
    T`\(f\) is both continuous and differentiable at \(x=1\)`
  ], ans: 3, ansTex: 'continuous and differentiable at \\(x = 1\\)',
  steps: [
    T`<b>Continuity:</b> plug \(x = 1\) into both pieces. Left: \(1^2 + 1 = 2\). Right: \(2(1) = 2\). They match, so \(f\) is continuous at \(x = 1\).`,
    T`<b>Differentiability:</b> take the derivative of each piece. Left: \(\frac{d}{dx}(x^2+1) = 2x\). Right: \(\frac{d}{dx}(2x) = 2\).`,
    T`Plug \(x=1\) into each derivative. Left: \(2(1) = 2\). Right: \(2\). The slopes match.`,
    T`Same y-value <i>and</i> same slope, so \(f\) is both continuous and differentiable at \(x=1\). <b>Answer: D</b>`
  ],
  trap: T`Choice C can <b>never</b> be correct on any test: a function that is differentiable at a point must be continuous there.`
},
/* Day 8 */ {
  match: 'Test FRQ 2(a)', topic: 'Sum/difference rules from a table', short: 'Table: sum & difference',
  group: 'frq2', type: 'num', table: 3,
  prompt: T`<p>The table gives values of \(f\), \(f'\), \(g\), and \(g'\) at selected values of \(x\).</p>{TABLE}<p>Let \(h(x) = 3f(x) - 2g(x) + x^2\). Find \(h'(3)\).</p>`,
  decode: T`Differentiate term by term (constants stay attached), <i>then</i> plug in x = 3. Since you need \(h'\), you’ll read from the <b>\(f'\)</b> and <b>\(g'\)</b> rows, not the \(f\) and \(g\) rows.`,
  answer: 10, ansTex: T`\(h'(3) = 10\)`, label: T`\(h'(3) =\)`,
  steps: [
    T`Differentiate each term: \(h'(x) = 3f'(x) - 2g'(x) + 2x\)`,
    T`Plug in \(x = 3\): \(h'(3) = 3f'(3) - 2g'(3) + 2(3)\)`,
    T`From the table, \(f'(3) = 2\) and \(g'(3) = 1\): \(h'(3) = 3(2) - 2(1) + 6\)`,
    T`\(= 6 - 2 + 6 = 10\)`
  ],
  trap: T`Using the \(f(3)\) and \(g(3)\) rows by mistake gives \(3(5) - 2(-1) + 6 = 23\). Circle the rows you need before you start.`
},
/* Day 9 */ {
  match: 'Test MC #7', topic: 'Derivatives in disguise', short: 'Derivative in disguise',
  group: 'mc', type: 'mc',
  prompt: T`<p>\(\displaystyle\lim_{h\to 0}\frac{(2+h)^3 - 8}{h} =\)</p>`,
  decode: T`This is a derivative wearing a costume. Match it to \(\displaystyle\lim_{h\to 0}\frac{f(a+h)-f(a)}{h} = f'(a)\). Find the function \(f\) and the number \(a\), then just take \(f'(a)\) — no algebra with the limit needed.`,
  choices: [T`\(0\)`, T`\(8\)`, T`\(12\)`, T`nonexistent`], ans: 2, ansTex: T`\(12\)`,
  steps: [
    T`Compare to \(\dfrac{f(a+h) - f(a)}{h}\). The \((2+h)^3\) tells you \(f(x) = x^3\) and \(a = 2\).`,
    T`Check the second term: \(f(2) = 2^3 = 8\). ✓ It matches, so the limit equals \(f'(2)\).`,
    T`Power Rule: \(f'(x) = 3x^2\).`,
    T`\(f'(2) = 3(2)^2 = 12\). <b>Answer: C</b>`
  ],
  trap: T`Plugging in \(h = 0\) gives \(\frac{0}{0}\), which is <i>not</i> 0 and not “does not exist” — it means more work is needed. Recognizing the derivative is the shortcut.`
},
/* Day 10 */ {
  match: 'Test MC #5', topic: "Reading a graph: where is f' undefined?", short: 'Graph: not differentiable',
  group: 'mc', type: 'mc', graph: GRAPH_DIFF,
  prompt: T`<p>The graph of \(f\) is shown. At which values of \(x\) in the open interval \(-5 < x < 5\) is \(f\) <b>not differentiable</b>?</p>`,
  decode: T`“Not differentiable” = the derivative does not exist there. Scan the graph for the three graph shapes that break a derivative: a <b>sharp corner</b>, a <b>break/jump</b> (discontinuity), or a <b>vertical tangent</b> (the graph goes straight up and down for an instant).`,
  choices: [T`\(x = -2\) only`, T`\(x = 1\) only`, T`\(x = -2\) and \(x = 1\) only`, T`\(x = -2,\ x = 1,\) and \(x = 3\)`],
  ans: 3, ansTex: T`\(x = -2,\ 1,\) and \(3\)`,
  steps: [
    T`\(x = -2\): <b>corner</b>. The slope just to the left is \(-1\), and just to the right it’s 0. Different slopes from each side → no derivative.`,
    T`\(x = 1\): <b>jump discontinuity</b> (closed dot at \((1,4)\), graph restarts at \((1,-1)\)). Not continuous → not differentiable.`,
    T`\(x = 3\): <b>vertical tangent</b>. The curve is perfectly steep at \((3,1)\), and a vertical line’s slope is undefined.`,
    T`All three. <b>Answer: D</b>`
  ],
  trap: T`The vertical tangent at \(x=3\) is the one students miss — the graph looks smooth and connected, but the slope there is undefined.`
},
/* Day 11 */ {
  match: 'Test MC #1', topic: 'Product Rule', short: 'Product Rule',
  group: 'mc', type: 'mc',
  prompt: T`<p>Let \(h(x) = x^3 f(x)\), where \(f(1) = -2\) and \(f'(1) = 4\). What is \(h'(1)\)?</p>`,
  decode: T`\(x^3\) is multiplied by \(f(x)\), so it’s a <b>Product Rule</b> problem. The first function is \(x^3\) (you know its derivative); the second is \(f(x)\) (you’re given its values).`,

    T`Product Rule: \(h'(x) = \big(x^3\big)'\,f(x) + x^3\,f'(x) = 3x^2 f(x) + x^3 f'(x)\)`,
    T`At \(x = 1\): \(h'(1) = 3(1)^2 f(1) + (1)^3 f'(1)\)`,
    T`Substitute: \(3(1)(-2) + (1)(4)\)`,
    T`\(= -6 + 4 = -2\). <b>Answer: C</b>`
  ],

},
/* Day 12 */ {
  match: 'Test FRQ 1(b)', topic: 'Instantaneous rate of change', short: 'Instantaneous rate',
  group: 'frq1', type: 'num',
  prompt: T`<p>Let \(f(x) = x^3 - 4x + 1\).</p><p>Find the <b>instantaneous rate of change</b> of \(f\) at \(x = 2\).</p>`,

/* Day 13 */ {
  match: 'Test MC #2', topic: 'Quotient Rule', short: 'Quotient Rule',
  group: 'mc', type: 'mc',
  prompt: T`<p>Let \(h(x) = \dfrac{g(x)}{x^2}\). If \(g(2) = 6\) and \(g'(2) = -1\), what is \(h'(2)\)?</p>`,
  decode: T`Function on top, \(x^2\) on bottom → <b>Quotient Rule</b>. The “low” function is \(x^2\), so “d-low” is \(2x\). Remember the bottom gets <b>squared</b>: \((x^2)^2 = x^4\).`,
  choices: [T`\(-\dfrac{7}{4}\)`, T`\(\dfrac{7}{4}\)`, T`\(-7\)`, T`\(-\dfrac{1}{4}\)`], ans: 0, ansTex: T`\(h'(2) = -\dfrac{7}{4}\)`,
  steps: [
    T`Quotient Rule with “high” \(= g(x)\) and “low” \(= x^2\): \(h'(x) = \dfrac{x^2\,g'(x) - g(x)\cdot 2x}{\big(x^2\big)^2}\)`,
    T`At \(x=2\): \(h'(2) = \dfrac{(2)^2 g'(2) - g(2)\cdot 2(2)}{(2^2)^2} = \dfrac{4(-1) - 6(4)}{16}\)`,
    T`\(= \dfrac{-4 - 24}{16} = \dfrac{-28}{16}\)`,
    T`\(= -\dfrac{7}{4}\). <b>Answer: A</b>`
  ],
  trap: T`Choice C (−7) is \(-28\) divided by \(4\) — forgetting to square the bottom. The denominator is \(\big(x^2\big)^2\), which is 16 at \(x=2\).`
},
/* Day 14 */ {
  match: 'Test MC #3', topic: 'Piecewise: continuous and differentiable?', short: 'Piecewise functions',
  group: 'mc', type: 'mc',
  prompt: T`<p>Let \(f(x) = \begin{cases} x^2, & x \le 2 \\ 3x - 2, & x > 2 \end{cases}\)</p><p>Which of the following is true about \(f\) at \(x = 2\)?</p>`,
  decode: T`Same two tests as always at the break point. Same <b>y-values</b>? → continuous. Same <b>slopes</b>? → differentiable.`,
  choices: [
    T`\(f\) is neither continuous nor differentiable at \(x=2\)`,
    T`\(f\) is continuous but not differentiable at \(x=2\)`,
    T`\(f\) is differentiable but not continuous at \(x=2\)`,

  ], ans: 1, ansTex: 'continuous but not differentiable at \\(x = 2\\)',
  steps: [
    T`<b>Continuity:</b> Left: \(2^2 = 4\). Right: \(3(2) - 2 = 4\). Match → continuous.`,

    T`At \(x=2\): left slope \(2(2) = 4\), right slope \(3\). \(4 \ne 3\), so the graph has a corner.`,

/* Day 15 */ {

  prompt: T`<p>The table gives values of \(f\), \(f'\), \(g\), and \(g'\) at selected values of \(x\).</p>{TABLE}<p>Let \(k(x) = f(x)\,g(x)\). Find \(k'(2)\).</p>`,

  steps: [

/* Day 16 */ {

/* Day 17 */ {
  match: 'Test MC #6', topic: 'Trig derivatives at a radian value', short: 'Trig derivatives',
  group: 'mc', type: 'mc',
  prompt: T`<p>If \(f(x) = \tan x + \sec x\), what is \(f'\!\left(\dfrac{\pi}{4}\right)\)?</p>`,

  steps: [
    T`Rules: \(\dfrac{d}{dx}\tan x = \sec^2 x\) and \(\dfrac{d}{dx}\sec x = \sec x\tan x\). So \(f'(x) = \sec^2 x + \sec x\tan x\).`,

},
/* Day 18 */ {
  match: 'Test MC #7', topic: 'Derivatives in disguise', short: 'Derivative in disguise',
  group: 'mc', type: 'mc',

    T`Match to \(\dfrac{f(a+h)-f(a)}{h}\): \(f(x) = \sin x\) and \(a = \frac{\pi}{6}\).`,

  ],

},
/* Day 19 */ {
  match: 'Test FRQ 1(c)', topic: 'Equation of a tangent line', short: 'Tangent line equation',
  group: 'frq1', type: 'line', lineF: x => -x - 1,
  prompt: T`<p>Let \(f(x) = x^3 - 4x + 1\).</p><p>Write an equation for the line tangent to the graph of \(f\) at \(x = 1\).</p>`,
  decode: T`Every tangent line needs <b>a point</b> and <b>a slope</b>. Point: \(\big(1, f(1)\big)\). Slope: \(f'(1)\). Then use point-slope form \(y - y_1 = m(x - x_1)\). You do <b>not</b> need to simplify.`,
  ansTex: T`\(y + 2 = -1(x - 1)\), which is the same line as \(y = -x - 1\)`, label: 'Tangent line equation:',
  steps: [
    T`<b>Point:</b> \(f(1) = 1^3 - 4(1) + 1 = -2\). The point is \((1, -2)\).`,
    T`<b>Slope:</b> \(f'(x) = 3x^2 - 4\), so \(f'(1) = 3 - 4 = -1\).`,
    T`<b>Point-slope form:</b> \(y - (-2) = -1(x - 1)\), or \(y + 2 = -1(x - 1)\).`,
    T`That is a complete answer. (If you want slope-intercept: \(y = -x - 1\).)`
  ],
  trap: T`Using \(f'(x)\) in place of a number for the slope gives a curve, not a line. The slope must be the <b>number</b> \(f'(1)\).`
},
/* Day 20 */ {
  match: 'Test MC #5', topic: 'Reading a graph: where is f undefined?', short: 'Graph: f undefined',
  group: 'mc', type: 'mc', graph: GRAPH_UNDEF,
  prompt: T`<p>The graph of \(f\) is shown. For which values of \(x\) is \(f(x)\) <b>undefined</b>?</p>`,
  decode: T`\(f(a)\) is defined only if the graph has an actual point at \(x=a\) — a solid curve or a <b>filled dot</b>. An <b>open circle</b> alone, or a vertical asymptote, means there is no value there.`,
  choices: [T`\(x = -1\) only`, T`\(x = -1\) and \(x = 2\) only`, T`\(x = -1,\ x = 2,\) and \(x = 4\)`, T`\(x = 2\) and \(x = 4\) only`],
  ans: 1, ansTex: T`\(x = -1\) and \(x = 2\)`,
  steps: [
    T`\(x = -1\): vertical asymptote. The graph never reaches \(x=-1\), so \(f(-1)\) is undefined.`,
    T`\(x = 2\): open circle (a hole) and no filled dot anywhere above or below it. \(f(2)\) is undefined.`,
    T`\(x = 4\): open circle on the curve, <b>but</b> a filled dot at \((4, -2)\). So \(f(4) = -2\) — it <i>is</i> defined (just not continuous).`,
    T`Undefined only at \(x=-1\) and \(x=2\). <b>Answer: B</b>`
  ],
  trap: T`“Undefined” is not the same as “discontinuous.” At \(x=4\), \(f\) is discontinuous (and not differentiable), but \(f(4)\) exists.`
},
/* Day 21 */ {
  match: 'Test MC #1', topic: 'Product Rule', short: 'Product Rule',

function vtable(rows, hl) {
  // rows: [[labelTeX, [values...]], ...]; first row is the header row
  let h = '<div class="tbl-wrap"><table class="vals"><tbody>';
  rows.forEach(([lab, vals], r) => {
    h += '<tr><th scope="row">' + lab + '</th>';
    vals.forEach((v, i) => {
      const cls = (hl != null && i === hl) ? ' class="hl"' : '';
      h += r === 0 ? '<th' + cls + '>' + v + '</th>' : '<td' + cls + '>' + v + '</td>';
    });
    h += '</tr>';
  });
  return h + '</tbody></table></div>';
}

  ans: 2, ansTex: T`\(f'(3) = 3\)`,
  steps: [
    T`Rule: \(\dfrac{d}{dx}e^{u} = e^{u}\cdot u'\), with \(u = x^2 - 3x\) and \(u' = 2x - 3\).`,
    T`\(f'(x) = e^{x^2 - 3x}\,(2x - 3)\)`,
    T`At \(x = 3\): exponent \(= 9 - 9 = 0\), so \(e^0 = 1\). And \(2(3) - 3 = 3\).`,
    T`\(f'(3) = 1\cdot 3 = 3\). <b>Answer: C</b>`
  ],
  trap: T`Choice A (1) is \(e^0\) alone: the derivative of the exponent was dropped. The exponent being 0 makes \(e^0 = 1\), not the whole answer 0 or 1.`
},
{ id: 'u3A-mc6', set: 'A', code: 'MC 6', twin: 'u3B-mc6', match: 'Test MC #6', topic: 'Finding dy/dx implicitly', short: 'Implicit dy/dx',
  type: 'mc',
  prompt: T`<p>If \(x^3 + y^3 = 6xy\), then \(\dfrac{dy}{dx} =\)</p>`,
  decode: T`Differentiate both sides with respect to \(x\). Each \(y\)-term gets a \(\frac{dy}{dx}\) attached; \(6xy\) is a product, so it needs the Product Rule. Then gather every \(\frac{dy}{dx}\) term on one side and factor it out.`,
  choices: [T`\(-\dfrac{x^2}{y^2}\)`, T`\(\dfrac{x^2 - 2y}{y^2 - 2x}\)`, T`\(\dfrac{2y - x^2}{y^2}\)`, T`\(\dfrac{2y - x^2}{y^2 - 2x}\)`],
  ans: 3, ansTex: T`\(\dfrac{dy}{dx} = \dfrac{2y - x^2}{y^2 - 2x}\)`,
  steps: [
    T`Differentiate: \(3x^2 + 3y^2\frac{dy}{dx} = 6y + 6x\frac{dy}{dx}\) (Product Rule on \(6xy\): \(6\cdot y + 6x\cdot\frac{dy}{dx}\)).`,
    T`Move all \(\frac{dy}{dx}\) terms left, everything else right: \(3y^2\frac{dy}{dx} - 6x\frac{dy}{dx} = 6y - 3x^2\)`,
    T`Factor: \(\frac{dy}{dx}\,(3y^2 - 6x) = 6y - 3x^2\)`,
    T`Divide: \(\frac{dy}{dx} = \dfrac{6y - 3x^2}{3y^2 - 6x} = \dfrac{2y - x^2}{y^2 - 2x}\) (divide top and bottom by 3). <b>Answer: D</b>`
  ],
  trap: T`Choice A treats \(6xy\) like a constant (derivative 0). Choice C forgets the \(6x\frac{dy}{dx}\) piece of the Product Rule. Choice B has the top flipped: careful with signs when moving terms across the equal sign.`
},
{ id: 'u3A-mc7', set: 'A', code: 'MC 7', twin: 'u3B-mc7', match: 'Test MC #7', topic: 'Derivative of an inverse from a table', short: 'Inverse derivative: table',
  type: 'mc',
  prompt: T`<p>The function \(f\) is differentiable and one-to-one. Selected values of \(f\) and \(f'\) are shown. If \(g\) is the inverse function of \(f\), what is \(g'(4)\)?</p>${vtable(ff(A7))}`,
  decode: T`The inverse switches inputs and outputs. To find \(g'(4)\), first find which \(x\) makes \(f(x) = 4\). Then the inverse slope is the <b>reciprocal</b> of \(f'\) at <i>that</i> x: \(g'(b) = \dfrac{1}{f'(a)}\) where \(f(a) = b\).`,
  choices: [T`\(\dfrac{1}{5}\)`, T`\(\dfrac{1}{6}\)`, T`\(5\)`, T`\(6\)`],
  ans: 0, ansTex: T`\(g'(4) = \dfrac{1}{5}\)`,
  steps: [
    T`Find where \(f\) outputs 4: the table shows \(f(2) = 4\). So the point \((2, 4)\) is on \(f\), and \((4, 2)\) is on \(g\).`,
    T`Inverse derivative rule: \(g'(4) = \dfrac{1}{f'\big(g(4)\big)} = \dfrac{1}{f'(2)}\)`,
    T`From the table, \(f'(2) = 5\). So \(g'(4) = \dfrac{1}{5}\). <b>Answer: A</b>`
  ],
  trap: T`Choice B uses the x = 4 column: \(\frac{1}{f'(4)}\). For an inverse, 4 is an <b>output</b> of \(f\), so you look for 4 in the \(f(x)\) row, not the \(x\) row.`
},
{ id: 'u3A-8a', set: 'A', code: 'FRQ 8a', twin: 'u3B-8a', match: 'Test FRQ 8', topic: 'Inverse derivative from a table (show the setup)', short: 'Inverse derivative setup', calc: false,
  type: 'num', answer: 1 / 5, label: T`\(h'(4) =\)`,
  prompt: T`${STEM8(A8)}<p>Let \(h\) be the inverse function of \(f\). Find \(h'(4)\). Show the setup you would write on the test.</p>`,
  decode: T`“Show the setup” means two little charts: one for \(f\) and one for its inverse \(h\). Find the column where \(f(x) = 4\), write that point and slope for \(f\), then <b>flip the point</b> and <b>flip the slope</b> (reciprocal) for \(h\).`,
  ansTex: T`\(h'(4) = \dfrac{1}{f'(3)} = \dfrac{1}{5}\)`,
  steps: [
    T`Look for 4 in the \(f(x)\) row: \(f(3) = 4\). So \(h(4) = 3\).`,
    T`<b>Setup (two charts):</b>${vtable([['', ['\\(x\\)', 'value', 'slope']], ['\\(f\\)', ['\\(3\\)', '\\(f(3) = 4\\)', "\\(f'(3) = 5\\)"]], ['\\(h = f^{-1}\\)', ['\\(4\\)', '\\(h(4) = 3\\)', "\\(h'(4) = \\tfrac{1}{5}\\)"]]])}The x and y values swap; the slope becomes its reciprocal.`,
    T`Written out: \(h'(4) = \dfrac{1}{f'\big(h(4)\big)} = \dfrac{1}{f'(3)} = \dfrac{1}{5}\)`
  ],
  trap: T`Using the x = 4 column gives \(\frac{1}{f'(4)} = \frac{1}{3}\), the most common mistake. On the free response, the two charts (or the line \(h'(4) = \frac{1}{f'(3)}\)) earn the setup point even if your arithmetic slips.`
},
{ id: 'u3A-8b', set: 'A', code: 'FRQ 8b', twin: 'u3B-8b', match: 'Test FRQ 8', topic: 'Chain Rule with function notation from a table', short: 'Chain Rule from a table', calc: false,
  type: 'num', answer: 12, label: T`\(k'(1) =\)`,
  prompt: T`${STEM8(A8)}<p>Let \(k(x) = g\big(f(x)\big)\). Find \(k'(1)\).</p>`,
  decode: T`Outside function \(g\), inside function \(f\). Chain Rule: \(k'(1) = g'\big(f(1)\big)\cdot f'(1)\). Work it in order: find \(f(1)\) first, then look up \(g'\) at <b>that</b> number.`,
  ansTex: T`\(k'(1) = g'(3)\cdot f'(1) = 2\cdot 6 = 12\)`,
  steps: [
    T`Chain Rule: \(k'(x) = g'\big(f(x)\big)\cdot f'(x)\), so \(k'(1) = g'\big(f(1)\big)\cdot f'(1)\).`,
    T`Inside first: \(f(1) = 3\). So we need \(g'(3)\), which is \(2\).`,
    T`\(f'(1) = 6\).`,
    T`\(k'(1) = g'(3)\cdot f'(1) = 2\cdot 6 = 12\)`
  ],
  trap: T`Using \(g'(1)\) instead of \(g'(f(1))\) gives \(4\cdot 6 = 24\). The answer \(g'(3)\cdot f'(1)\) written out, even without multiplying, is what graders look for.`
},
{ id: 'u3A-8c', set: 'A', code: 'FRQ 8c', twin: 'u3B-8c', match: 'Test FRQ 8', topic: 'Tangent line with a trig function', short: 'Tangent line: trig', calc: false,
  type: 'line', lineF: x => Math.sqrt(3) + 3 * (x - Math.PI / 9), label: 'Tangent line equation:',
  prompt: T`<p>Let \(p(x) = 2\sin(3x)\). Write an equation for the line tangent to the graph of \(p\) at \(x = \dfrac{\pi}{9}\).</p>`,
  decode: T`A tangent line needs a <b>point</b> \(\big(\frac{\pi}{9}, p(\frac{\pi}{9})\big)\) and a <b>slope</b> \(p'(\frac{\pi}{9})\). The derivative needs the Chain Rule because of the \(3x\) inside the sine. Use the unit circle at \(3\cdot\frac{\pi}{9} = \frac{\pi}{3}\).`,
  ansTex: T`\(y - \sqrt{3} = 3\left(x - \dfrac{\pi}{9}\right)\)`,
  help: 'Type sqrt(3) for √3 and pi for π. Example: y - sqrt(3) = 3(x - pi/9)',
  steps: [
    T`<b>Point:</b> \(p\!\left(\frac{\pi}{9}\right) = 2\sin\!\left(\frac{\pi}{3}\right) = 2\cdot\frac{\sqrt{3}}{2} = \sqrt{3}\). The point is \(\left(\frac{\pi}{9}, \sqrt{3}\right)\).`,
    T`<b>Derivative</b> (Chain Rule): \(p'(x) = 2\cos(3x)\cdot 3 = 6\cos(3x)\)`,
    T`<b>Slope:</b> \(p'\!\left(\frac{\pi}{9}\right) = 6\cos\!\left(\frac{\pi}{3}\right) = 6\cdot\frac{1}{2} = 3\)`,
    T`<b>Point-slope form:</b> \(y - \sqrt{3} = 3\left(x - \dfrac{\pi}{9}\right)\). No need to simplify.`
  ],
  trap: T`Forgetting the inner derivative 3 gives slope \(2\cos\frac{\pi}{3} = 1\). Also, evaluate the trig at \(3x = \frac{\pi}{3}\), not at \(\frac{\pi}{9}\).`
},
{ id: 'u3A-10a', set: 'A', code: 'FRQ 10a', twin: 'u3B-10a', match: 'Test FRQ 10', topic: 'Velocity function from position', short: 'Velocity function', calc: true,
  type: 'expr', exprF: t => 4 * t + 5 * Math.sin(t), label: T`\(v(t) =\)`,
  help: 'Use t as the variable. Example: 3t^2 - 2cos(t)',
  prompt: T`${STEM_A10}<p>Find the velocity function \(v(t)\).</p>`,
  decode: T`Velocity is the derivative of position: \(v(t) = s'(t)\). Differentiate term by term.`,
  ansTex: T`\(v(t) = 4t + 5\sin t\)`,
  steps: [
    T`\(v(t) = s'(t) = \dfrac{d}{dt}\big(2t^2\big) - 5\,\dfrac{d}{dt}(\cos t)\)`,
    T`\(\dfrac{d}{dt}\big(2t^2\big) = 4t\) and \(\dfrac{d}{dt}(\cos t) = -\sin t\)`,
    T`\(v(t) = 4t - 5(-\sin t) = 4t + 5\sin t\)`
  ],
  trap: T`Minus times the negative from \(\frac{d}{dt}\cos t\) makes a <b>plus</b>. Writing \(4t - 5\sin t\) is the classic sign error.`
},
{ id: 'u3A-10b', set: 'A', code: 'FRQ 10b', twin: 'u3B-10b', match: 'Test FRQ 10', topic: 'Instantaneous rate of change of position, with units', short: 'IROC with units', calc: true,
  type: 'num', answer: 8 + 5 * Math.sin(2), tol: 0.0015, units: UNITS_A, unitAns: 'ft/sec', label: T`Rate at \(t = 2\):`,
  help: 'Give 3 decimal places (calculator in radian mode). Then choose the units.',
  prompt: T`${STEM_A10}<p>Find the instantaneous rate of change of the particle’s position at \(t = 2\). Include units.</p>`,
  decode: T`“Instantaneous rate of change of position” is just a fancy name for <b>velocity</b> at that moment: \(v(2)\). Units are position units over time units: feet per second.`,
  ansTex: T`\(v(2) = 8 + 5\sin 2 \approx 12.546\) ft/sec`,
  steps: [
    T`Instantaneous rate of change of \(s\) at \(t = 2\) means \(s'(2) = v(2)\).`,
    T`From part (a): \(v(t) = 4t + 5\sin t\), so \(v(2) = 8 + 5\sin(2)\).`,
    T`Calculator in <b>radian</b> mode: \(\sin 2 \approx 0.909297\), so \(v(2) \approx 8 + 4.546 = 12.546\).`,
    T`Units: feet per second. <b>Answer: 12.546 ft/sec</b>`
  ],
  trap: T`If your calculator is in <b>degree</b> mode you’ll get 8.174. Calculus always uses radians. And a velocity answer without “ft/sec” loses the units point.`
},
{ id: 'u3A-10c', set: 'A', code: 'FRQ 10c', twin: 'u3B-10c', match: 'Test FRQ 10', topic: 'Acceleration function', short: 'Acceleration function', calc: true,
  type: 'expr', exprF: t => 4 + 5 * Math.cos(t), label: T`\(a(t) =\)`,
  help: 'Use t as the variable.',
  prompt: T`${STEM_A10}<p>Find the acceleration function \(a(t)\).</p>`,
  decode: T`Acceleration is the derivative of velocity (the second derivative of position): \(a(t) = v'(t) = s''(t)\). Start from your answer to part (a).`,
  ansTex: T`\(a(t) = 4 + 5\cos t\)`,
  steps: [
    T`Start from velocity: \(v(t) = 4t + 5\sin t\).`,
    T`\(a(t) = v'(t) = 4 + 5\cos t\)`
  ],
  trap: T`Differentiate the <b>velocity</b>, not the position again. \(\frac{d}{dt}\sin t = \cos t\) (positive).`
},
{ id: 'u3A-10d', set: 'A', code: 'FRQ 10d', twin: 'u3B-10d', match: 'Test FRQ 10', topic: 'Acceleration at a time, with units', short: 'Acceleration with units', calc: true,
  type: 'num', answer: 4 + 5 * Math.cos(2), tol: 0.0015, units: UNITS_A, unitAns: 'ft/sec²', label: T`\(a(2) =\)`,
  help: 'Give 3 decimal places. Then choose the units.',
  prompt: T`${STEM_A10}<p>Find the acceleration of the particle at \(t = 2\). Include units.</p>`,
  decode: T`Plug \(t = 2\) into \(a(t)\). Acceleration units are velocity units per time unit: feet per second per second, written ft/sec².`,
  ansTex: T`\(a(2) = 4 + 5\cos 2 \approx 1.919\) ft/sec²`,
  steps: [
    T`\(a(t) = 4 + 5\cos t\), so \(a(2) = 4 + 5\cos(2)\).`,
    T`Radian mode: \(\cos 2 \approx -0.416147\), so \(5\cos 2 \approx -2.081\).`,
    T`\(a(2) \approx 4 - 2.081 = 1.919\)`,
    T`<b>Answer: 1.919 ft/sec²</b>`
  ],
  trap: T`ft/sec is velocity; ft/sec² is acceleration. Mixing these up is the most common lost point on this part.`
},
{ id: 'u3A-11a', set: 'A', code: 'FRQ 11a', twin: 'u3B-11a', match: 'Test FRQ 11', topic: 'Complete the table for the inverse', short: 'Inverse table', calc: true,
  type: 'table', src: A11, cells: [A11.f, A11.x, A11.fp.map(v => 1 / v)],
  cellTex: [A11.f.map(String), A11.x.map(String), ['1', '\\tfrac{1}{2}', '\\tfrac{1}{4}', '\\tfrac{1}{5}']],
  prompt: T`${STEM11(A11)}<p>Complete the table for \(f^{-1}\). Each column of your table comes from the same column of the \(f\) table.</p>`,
  decode: T`For an inverse, <b>x and y trade places</b>: the outputs of \(f\) become the inputs of \(f^{-1}\). The slope of the inverse is the <b>reciprocal</b> of the slope of \(f\) at the matching point.`,
  ansTex: 'the completed table below',
  steps: [
    T`<b>x row:</b> the inputs of \(f^{-1}\) are the outputs of \(f\): \(1, 3, 6, 10\).`,
    T`<b>\(f^{-1}(x)\) row:</b> the outputs of \(f^{-1}\) are the inputs of \(f\): \(0, 1, 2, 3\).`,
    T`<b>Slope row:</b> \(\big(f^{-1}\big)'(f(a)) = \dfrac{1}{f'(a)}\), so take the reciprocal of each \(f'\) value: \(1, \tfrac{1}{2}, \tfrac{1}{4}, \tfrac{1}{5}\).`,
    T`${vtable([[INV_LABELS[0], ['1', '3', '6', '10']], [INV_LABELS[1], ['0', '1', '2', '3']], [INV_LABELS[2], ['\\(1\\)', '\\(\\tfrac12\\)', '\\(\\tfrac14\\)', '\\(\\tfrac15\\)']]])}`
  ],
  trap: T`The slopes become <b>reciprocals</b>, not negatives. \(-\frac{1}{f'}\) is the slope of a <i>perpendicular</i> line, which is a different idea.`
},
{ id: 'u3A-11b', set: 'A', code: 'FRQ 11b', twin: 'u3B-11b', match: 'Test FRQ 11', topic: 'Tangent line to f from a table', short: 'Tangent line to f', calc: true,
  type: 'line', lineF: x => 3 + 2 * (x - 1), label: 'Tangent line to f at x = 1:',
  prompt: T`${STEM11(A11)}<p>Write an equation for the line tangent to the graph of \(f\) at \(x = 1\).</p>`,
  decode: T`Everything comes from the \(x = 1\) column: the point is \(\big(1, f(1)\big)\) and the slope is \(f'(1)\).`,
  ansTex: T`\(y - 3 = 2(x - 1)\)`,
  steps: [
    T`Point: \(f(1) = 3\), so \((1, 3)\).`,
    T`Slope: \(f'(1) = 2\).`,
    T`\(y - 3 = 2(x - 1)\)`
  ],
  trap: T`The slope is \(f'(1)\), from the \(f'\) row, not \(f(1)\).`
},
{ id: 'u3A-11c', set: 'A', code: 'FRQ 11c', twin: 'u3B-11c', match: 'Test FRQ 11', topic: 'Tangent line to the inverse', short: 'Tangent line to f⁻¹', calc: true,
  type: 'line', lineF: x => 1 + (x - 3) / 2, label: T`Tangent line to \(f^{-1}\) at \(x = 3\):`,
  prompt: T`${STEM11(A11)}<p>Write an equation for the line tangent to the graph of \(f^{-1}\) at \(x = 3\).</p>`,
  decode: T`For the inverse at \(x = 3\): the point is \(\big(3, f^{-1}(3)\big)\) and the slope is \(\big(f^{-1}\big)'(3)\). Use your completed inverse table, or flip the point and the slope from \(f\).`,
  ansTex: T`\(y - 1 = \tfrac{1}{2}(x - 3)\)`,
  steps: [
    T`Find 3 in the \(f(x)\) row: \(f(1) = 3\). So \(f^{-1}(3) = 1\), and the point is \((3, 1)\).`,
    T`Slope: \(\big(f^{-1}\big)'(3) = \dfrac{1}{f'(1)} = \dfrac{1}{2}\)`,
    T`\(y - 1 = \tfrac{1}{2}(x - 3)\)`
  ],
  trap: T`Compare with part (b): the point \((1, 3)\) flipped to \((3, 1)\), and the slope \(2\) flipped to \(\frac{1}{2}\). Inverse tangent lines always mirror the original this way.`
},

{ id: 'u3B-mc1', set: 'B', code: 'MC 1', twin: 'u3A-mc1', match: 'Test MC #1', topic: 'Chain Rule with function notation', short: 'Chain Rule: f(g(x))',
  type: 'mc',
  prompt: T`<p>Let \(h(x) = f\big(x^2 + 1\big)\). If \(f'(2) = -4\) and \(f'(5) = 3\), find \(h'(2)\).</p>`,
  decode: T`The inside function is \(x^2 + 1\). Chain Rule: \(h'(x) = f'\big(x^2 + 1\big)\cdot 2x\). At \(x = 2\), the inside equals \(5\), so you need \(f'(5)\).`,
  choices: [T`\(3\)`, T`\(-16\)`, T`\(12\)`, T`\(6\)`],
  ans: 2, ansTex: T`\(h'(2) = 12\)`,
  steps: [
    T`Chain Rule: \(h'(x) = f'\big(x^2 + 1\big)\cdot\dfrac{d}{dx}\big(x^2 + 1\big) = f'\big(x^2 + 1\big)\cdot 2x\)`,
    T`At \(x = 2\): the inside is \(2^2 + 1 = 5\), so \(h'(2) = f'(5)\cdot 2(2)\).`,
    T`\(h'(2) = 3\cdot 4 = 12\). <b>Answer: C</b>`
  ],
  trap: T`Choice B uses \(f'(2)\): evaluate \(f'\) at the <b>inside value</b> (5), not at 2. Choice A forgets the inner derivative \(2x\).`
},
{ id: 'u3B-mc2', set: 'B', code: 'MC 2', twin: 'u3A-mc2', match: 'Test MC #2', topic: 'Tangent line to an implicit curve', short: 'Implicit tangent line',
  type: 'mc',
  prompt: T`<p>The point \((1, 2)\) lies on the curve \(y^2 - 3xy + x^2 = -1\). Which of the following is an equation of the tangent line to the curve at this point?</p>`,
  decode: T`Implicit differentiation, then plug in \(x = 1,\ y = 2\) to get the slope. The \(-3xy\) term needs the Product Rule.`,
  choices: [T`\(y - 2 = 4(x - 1)\)`, T`\(y - 2 = -4(x - 1)\)`, T`\(y - 2 = \tfrac{1}{4}(x - 1)\)`, T`\(y - 1 = 4(x - 2)\)`],
  ans: 0, ansTex: T`\(y - 2 = 4(x - 1)\)`,
  steps: [
    T`Differentiate: \(2y\frac{dy}{dx} - 3\Big(y + x\frac{dy}{dx}\Big) + 2x = 0\)`,
    T`Plug in \(x = 1,\ y = 2\): \(4\frac{dy}{dx} - 6 - 3\frac{dy}{dx} + 2 = 0\)`,
    T`\(\frac{dy}{dx} - 4 = 0 \;\Rightarrow\; \frac{dy}{dx} = 4\)`,
    T`\(y - 2 = 4(x - 1)\). <b>Answer: A</b>`
  ],
  trap: T`Distribute the \(-3\) to <b>both</b> pieces of the Product Rule: \(-3y\) and \(-3x\frac{dy}{dx}\). Missing one sign there gives choice B.`
},
{ id: 'u3B-mc3', set: 'B', code: 'MC 3', twin: 'u3A-mc3', match: 'Test MC #3', topic: 'Chain Rule with trig functions', short: 'Chain Rule: trig',
  type: 'mc',
  prompt: T`<p>If \(f(x) = \sec(2x)\), what is \(f'\!\left(\dfrac{\pi}{8}\right)\)?</p>`,
  decode: T`\(\dfrac{d}{dx}\sec u = \sec u\tan u\cdot u'\). Here \(u = 2x\), so multiply by 2. At \(x = \frac{\pi}{8}\), the inside is \(\frac{\pi}{4}\).`,
  choices: [T`\(\sqrt{2}\)`, T`\(2\)`, T`\(4\)`, T`\(2\sqrt{2}\)`],
  ans: 3, ansTex: T`\(f'\!\left(\tfrac{\pi}{8}\right) = 2\sqrt{2}\)`,
  steps: [
    T`\(f'(x) = \sec(2x)\tan(2x)\cdot 2\)`,
    T`At \(x = \frac{\pi}{8}\): \(2x = \frac{\pi}{4}\). \(\sec\frac{\pi}{4} = \frac{1}{\cos(\pi/4)} = \frac{2}{\sqrt{2}} = \sqrt{2}\), and \(\tan\frac{\pi}{4} = 1\).`,
    T`\(f'\!\left(\frac{\pi}{8}\right) = 2\cdot\sqrt{2}\cdot 1 = 2\sqrt{2}\). <b>Answer: D</b>`
  ],
  trap: T`Choice A (\(\sqrt{2}\)) forgets the inner derivative 2. Choice C uses \(\sec^2\) (that’s the derivative of <i>tangent</i>, not secant).`
},
{ id: 'u3B-mc4', set: 'B', code: 'MC 4', twin: 'u3A-mc4', match: 'Test MC #4', topic: 'Chain Rule with inverse trig', short: 'Chain Rule: inverse trig',
  type: 'mc',
  prompt: T`<p>\(\dfrac{d}{dx}\Big[\tan^{-1}\!\big(x^2\big)\Big] =\)</p>`,
  decode: T`\(\tan^{-1}\) means <b>arctan</b> (the inverse function), not \(\frac{1}{\tan}\). Rule: \(\dfrac{d}{dx}\arctan u = \dfrac{1}{1+u^2}\cdot u'\), with \(u = x^2\).`,
  choices: [T`\(\dfrac{2x}{1+x^2}\)`, T`\(\dfrac{1}{1+x^4}\)`, T`\(\dfrac{2x}{1+x^4}\)`, T`\(\dfrac{2x}{\sqrt{1-x^4}}\)`],
  ans: 2, ansTex: T`\(\dfrac{2x}{1+x^4}\)`,
  steps: [
    T`Rule: \(\dfrac{d}{dx}\arctan u = \dfrac{u'}{1+u^2}\), with \(u = x^2\) and \(u' = 2x\).`,
    T`\(u^2 = \big(x^2\big)^2 = x^4\)`,
    T`\(\dfrac{d}{dx}\tan^{-1}\!\big(x^2\big) = \dfrac{2x}{1+x^4}\). <b>Answer: C</b>`
  ],
  trap: T`Choice A forgets to square the inside (\(u^2 = x^4\), not \(x^2\)). Choice D uses the arcsine rule. Learn which rule has the square root: <b>arcsin</b> does, <b>arctan</b> doesn’t.`
},
{ id: 'u3B-mc5', set: 'B', code: 'MC 5', twin: 'u3A-mc5', match: 'Test MC #5', topic: 'Chain Rule with e-functions', short: 'Chain Rule: eˣ',
  type: 'mc',
  prompt: T`<p>If \(y = x\,e^{2x}\), then \(\dfrac{dy}{dx} =\)</p>`,

const pl = pts => x => {
  for (let i = 0; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
    if (x >= x0 && x <= x1) return y0 + (y1 - y0) * (x - x0) / (x1 - x0);

  return NaN;
};

{ id: 'u4A-mc3', set: 'A', code: 'MC 3', twin: 'u4B-mc3', match: 'Test MC #3', topic: 'Particle motion with a calculator', short: 'Speeding up or slowing down', calc: true,
  type: 'mc',
  prompt: T`<p>A particle moves along a line with velocity \(v(t) = t\cos t + 1\) for \(t \ge 0\). Which of the following is true at \(t = 2\)?</p>`,
  decode: T`“Speeding up or slowing down” compares the <b>signs</b> of velocity and acceleration. Same sign → speeding up. Opposite signs → slowing down. Find \(v(2)\) directly, and \(a(2) = v'(2)\) with your calculator’s derivative function (radian mode).`,
  choices: [T`\(v(2) \approx 0.168\), and the particle is speeding up`, T`\(v(2) \approx 0.168\), and the particle is slowing down`, T`\(v(2) \approx 2.999\), and the particle is speeding up`, T`\(v(2) \approx -2.235\), and the particle is slowing down`],
  ans: 1, ansTex: T`\(v(2) \approx 0.168 > 0\) and \(a(2) \approx -2.235 < 0\): slowing down`,
  steps: [
    T`\(v(2) = 2\cos 2 + 1 \approx 2(-0.4161) + 1 \approx 0.168\). Positive.`,
    T`\(a(2) = v'(2)\). Calculator: \(\dfrac{d}{dt}\big(t\cos t + 1\big)\Big|_{t=2} \approx -2.235\). Negative.`,
    T`(By hand: \(v'(t) = \cos t - t\sin t\), so \(v'(2) = \cos 2 - 2\sin 2 \approx -2.235\).)`,
    T`\(v > 0\) and \(a < 0\) have <b>opposite signs</b>, so the particle is slowing down. <b>Answer: B</b>`
  ],
  trap: T`Choice C is degree mode. Choice D reports the <b>acceleration</b> as if it were the velocity. And “a is negative” does <b>not</b> automatically mean slowing down: you always compare it with the sign of \(v\).`
},
{ id: 'u4A-mc4', set: 'A', code: 'MC 4', twin: 'u4B-mc4', match: 'Test MC #4', topic: 'Approximating with linearization', short: 'Linear approximation', calc: false,
  type: 'mc',
  prompt: T`<p>A differentiable function \(f\) has \(f(3) = 4\) and \(f'(3) = -2\). Using the line tangent to the graph of \(f\) at \(x = 3\), what is the approximation of \(f(3.2)\)?</p>`,
  decode: T`The tangent line at \(x = 3\) is \(L(x) = f(3) + f'(3)(x - 3)\). Near \(x = 3\), the tangent line and the curve are almost the same, so plug \(3.2\) into \(L\).`,
  choices: [T`\(4.4\)`, T`\(3.8\)`, T`\(3.6\)`, T`\(-2.4\)`], ans: 2, ansTex: T`\(f(3.2) \approx 3.6\)`,
  steps: [
    T`Tangent line: \(L(x) = 4 - 2(x - 3)\).`,
    T`\(L(3.2) = 4 - 2(3.2 - 3) = 4 - 2(0.2)\)`,
    T`\(= 4 - 0.4 = 3.6\). <b>Answer: C</b>`
  ],
  trap: T`Choice D forgets to subtract 3: \(4 - 2(3.2)\). Choice A loses the negative slope. The step size is \(x - a = 0.2\), not \(3.2\).`
},
{ id: 'u4A-mc5', set: 'A', code: 'MC 5', twin: 'u4B-mc5', match: 'Test MC #5', topic: 'L’Hôpital’s Rule from a graph', short: 'L’Hôpital from a graph', calc: false,
  type: 'mc',
  prompt: T`<p>The graph of the function \(f\), made of straight segments, is shown. What is \(\displaystyle\lim_{x \to 2} \frac{f(x)}{x^2 - 4}\)?</p>`,
  graph: GRAPH_LA,
  decode: T`First <b>plug in</b>: read \(f(2)\) from the graph, and \(2^2 - 4 = 0\). If you get \(\frac{0}{0}\), L’Hôpital lets you replace top and bottom with their <b>derivatives</b>. On a line-segment graph, \(f'(2)\) is the <b>slope</b> of the segment through \(x = 2\).`,
  choices: [T`\(-\dfrac{1}{2}\)`, T`\(-2\)`, T`\(0\)`, T`The limit does not exist.`], ans: 0, ansTex: T`\(\displaystyle\lim_{x\to 2}\frac{f(x)}{x^2-4} = \frac{f'(2)}{2(2)} = -\frac{1}{2}\)`,
  steps: [
    T`Plug in: \(f(2) = 0\) (the graph crosses the \(x\)-axis there) and \(2^2 - 4 = 0\). That’s \(\frac{0}{0}\), so L’Hôpital applies.`,
    T`The segment from \((1, 2)\) to \((3, -2)\) has slope \(\dfrac{-2 - 2}{3 - 1} = -2\), so \(f'(2) = -2\).`,
    T`The derivative of the bottom is \(2x\), which is \(4\) at \(x = 2\).`,
    T`\(\displaystyle\lim_{x \to 2}\frac{f(x)}{x^2 - 4} = \frac{f'(2)}{2\cdot 2} = \frac{-2}{4} = -\frac{1}{2}\). <b>Answer: A</b>`
  ],
  trap: T`Choice B takes the derivative of the top only. Choice D is the \(\frac{0}{0}\) panic: zero over zero is a signal to use L’Hôpital, not a final answer. On the FRQ, write “\(\frac{0}{0}\)” or show both limits are 0 to earn the point for using the rule.`
},
{ id: 'u4A-6', set: 'A', code: 'FRQ 6', twin: 'u4B-6', match: 'Test FRQ 6', topic: 'Finding the linearization equation', short: 'Linearization equation', calc: false,
  type: 'line', lineF: x => 4 + 3 / 8 * (x - 4), label: T`\(L(x) =\) (or \(y =\))`,
  help: 'Any correct form works, e.g. y = 4 + 3/8(x - 4). No need to simplify.',
  prompt: T`<p>Let \(f(x) = \sqrt{3x + 4}\). Find the linearization \(L(x)\) of \(f\) at \(x = 4\).</p>`,
  decode: T`“Linearization” is just the <b>tangent line</b>, written as \(L(x) = f(a) + f'(a)(x - a)\). You need two numbers: \(f(4)\) and \(f'(4)\). The derivative needs the Chain Rule because of the \(3x + 4\) inside the root.`,
  ansTex: T`\(L(x) = 4 + \tfrac{3}{8}(x - 4)\)`,
  steps: [
    T`<b>Point:</b> \(f(4) = \sqrt{12 + 4} = \sqrt{16} = 4\).`,
    T`<b>Derivative</b> (Chain Rule): \(f'(x) = \dfrac{1}{2\sqrt{3x + 4}}\cdot 3 = \dfrac{3}{2\sqrt{3x + 4}}\)`,
    T`<b>Slope:</b> \(f'(4) = \dfrac{3}{2\cdot 4} = \dfrac{3}{8}\)`,
    T`\(L(x) = 4 + \dfrac{3}{8}(x - 4)\)`
  ],
  trap: T`Forgetting the inside derivative 3 gives slope \(\frac{1}{8}\). Also, the slope is \(f'(4)\), evaluated at the number, not the formula \(f'(x)\) left in the equation.`
},
{ id: 'u4A-7', set: 'A', code: 'FRQ 7', twin: 'u4B-7', match: 'Test FRQ 7', topic: 'Over- or underestimate from concavity', short: 'Over or under?', calc: false,
  type: 'mc',
  prompt: T`<p>Let \(f(x) = \sqrt{3x + 4}\), with linearization \(L(x) = 4 + \tfrac{3}{8}(x - 4)\) at \(x = 4\) (from FRQ 6). The value \(L(4.2) = 4.075\) is used to approximate \(f(4.2)\). Which statement correctly describes this approximation?</p>`,
  decode: T`Over or under depends on <b>concavity</b>, which comes from the <b>second derivative</b>. Concave down (\(f'' < 0\)): the curve bends below its tangent line, so the line is too high → <b>overestimate</b>. Concave up (\(f'' > 0\)): the line is below the curve → <b>underestimate</b>.`,
  choices: [
    T`Underestimate, because \(f''(x) < 0\), so the graph of \(f\) lies above its tangent line`,
    T`Overestimate, because \(f'(x) > 0\), so \(f\) is increasing`,
    T`Overestimate, because \(f''(x) < 0\), so \(f\) is concave down and its graph lies below the tangent line`,
    T`Underestimate, because \(f'(x) > 0\), so the graph of \(f\) lies above its tangent line`
  ],
  ans: 2, ansTex: T`Overestimate, since \(f'' < 0\) (concave down)`,
  steps: [
    T`From FRQ 6: \(f'(x) = \dfrac{3}{2}(3x + 4)^{-1/2}\).`,
    T`Differentiate again (Chain Rule): \(f''(x) = \dfrac{3}{2}\cdot\left(-\dfrac{1}{2}\right)(3x + 4)^{-3/2}\cdot 3 = -\dfrac{9}{4(3x + 4)^{3/2}}\)`,
    T`The denominator is positive, so \(f''(x) < 0\) near \(x = 4\). The graph is <b>concave down</b>.`,
    T`A concave-down graph bends <b>below</b> its tangent line, so the tangent line value is too big: \(L(4.2) = 4.075\) is an <b>overestimate</b>. <b>Answer: C</b>`
  ],
  trap: T`Increasing or decreasing (\(f'\)) has <b>nothing</b> to do with over/under. On the free response, the justification must name the <b>second derivative</b> (or concavity): “Since \(f''(x) < 0\), the graph is concave down, so the tangent line lies above the curve.”`
},
{ id: 'u4A-8a', set: 'A', code: 'FRQ 8a', twin: 'u4B-8a', match: 'Test FRQ 8', topic: 'Moving right, left, or stopped from a velocity graph', short: 'Right, left, stopped', calc: false,
  type: 'classify', graph: GRAPH_VA, opts: DIR,
  rows: [[T`\(0 < t < 1\)`, 'left'], [T`\(t = 1\)`, 'stop'], [T`\(1 < t < 7\)`, 'right'], [T`\(7 \le t \le 8\)`, 'stop'], [T`\(8 < t \le 9\)`, 'left']],
  prompt: T`${STEM_A8}<p>For each time or interval, decide whether the particle is moving right, moving left, or stopped.</p>`,
  decode: T`Direction comes from the <b>sign of velocity</b> only. Above the \(t\)-axis (\(v > 0\)): moving right. Below (\(v < 0\)): moving left. On the axis (\(v = 0\)): stopped. Don’t look at whether the graph goes up or down; look at which side of the axis it’s on.`,
  ansTex: T`Right on \(1 < t < 7\); left on \(0 \le t < 1\) and \(8 < t \le 9\); stopped at \(t = 1\) and on \(7 \le t \le 8\)`,
  steps: [
    T`\(0 < t < 1\): graph is below the axis, \(v(t) < 0\) → <b>moving left</b>.`,
    T`\(t = 1\): \(v(1) = 0\) → <b>stopped</b> (for an instant, while it turns around).`,
    T`\(1 < t < 7\): graph is above the axis, \(v(t) > 0\) → <b>moving right</b>. This includes \(3 < t < 5\), where velocity is constant but still positive.`,
    T`\(7 \le t \le 8\): \(v(t) = 0\) the whole time → <b>stopped</b>. \(8 < t \le 9\): \(v(t) < 0\) → <b>moving left</b>.`,
    T`<b>Write it like this on the test:</b> “The particle moves right on \(1 < t < 7\) because \(v(t) > 0\). It moves left on \(0 \le t < 1\) and \(8 < t \le 9\) because \(v(t) < 0\). It is stopped at \(t = 1\) and for \(7 \le t \le 8\) because \(v(t) = 0\).”`
  ],
  trap: T`On \(5 < t < 7\) the graph is going <b>down</b>, but the particle is still moving <b>right</b> because \(v\) is still positive. A falling velocity graph means slowing down, not turning around.`
},
{ id: 'u4A-8b', set: 'A', code: 'FRQ 8b', twin: 'u4B-8b', match: 'Test FRQ 8', topic: 'Speeding up or slowing down from a velocity graph', short: 'Speeding up / slowing down', calc: false,
  type: 'classify', graph: GRAPH_VA, opts: SPD,
  rows: [[T`\(0 < t < 1\)`, 'down'], [T`\(1 < t < 3\)`, 'up'], [T`\(3 < t < 5\)`, 'neither'], [T`\(5 < t < 7\)`, 'down'], [T`\(8 < t < 9\)`, 'up']],
  prompt: T`${STEM_A8}<p>For each interval, decide whether the particle is speeding up, slowing down, or neither.</p>`,
  decode: T`Compare <b>two signs</b>. Velocity: above or below the axis. Acceleration: the <b>slope</b> of the velocity graph (going up = positive, going down = negative). Same signs → speeding up. Opposite signs → slowing down. Slope 0 → constant speed.`,
  ansTex: T`Speeding up on \(1 < t < 3\) and \(8 < t < 9\); slowing down on \(0 < t < 1\) and \(5 < t < 7\); neither on \(3 < t < 5\)`,
  steps: [
    T`\(0 < t < 1\): \(v < 0\) (below axis), \(a > 0\) (graph rising) → opposite → <b>slowing down</b>.`,
    T`\(1 < t < 3\): \(v > 0\), \(a > 0\) → same → <b>speeding up</b>.`,
    T`\(3 < t < 5\): \(a = 0\) (flat segment) → constant speed, <b>neither</b>.`,
    T`\(5 < t < 7\): \(v > 0\), \(a < 0\) → opposite → <b>slowing down</b>. \(8 < t < 9\): \(v < 0\), \(a < 0\) → same → <b>speeding up</b>.`,
    T`<b>Write it like this:</b> “Speeding up on \(1 < t < 3\) and \(8 < t < 9\) because \(v(t)\) and \(a(t)\) have the same sign. Slowing down on \(0 < t < 1\) and \(5 < t < 7\) because \(v(t)\) and \(a(t)\) have opposite signs.”`
  ],
  trap: T`On \(8 < t < 9\) the graph goes <b>down</b>, but the particle is <b>speeding up</b>: it’s moving left faster and faster. Speed is how far the graph is from the axis, so heading away from the axis means speeding up.`
},
{ id: 'u4A-8c', set: 'A', code: 'FRQ 8c', twin: 'u4B-8c', match: 'Test FRQ 8', topic: 'Intervals of increasing and decreasing position from v(t)', short: 'Increasing / decreasing', calc: false,
  type: 'classify', opts: POS,
  rows: [[T`\(0 < t < 2\)`, 'inc'], [T`\(2 < t < 4\)`, 'dec'], [T`\(4 < t < 6\)`, 'inc']],
  prompt: T`<p>A particle moves along the \(x\)-axis with velocity \(v(t) = t^2 - 6t + 8\) for \(0 \le t \le 6\). On which intervals is the particle’s position increasing, and on which is it decreasing?</p>`,
  decode: T`Position increases where its derivative, the <b>velocity</b>, is positive, and decreases where velocity is negative. So: set \(v(t) = 0\), factor, and make a <b>sign chart</b> for \(v\).`,
  ansTex: T`Increasing on \(0 < t < 2\) and \(4 < t < 6\); decreasing on \(2 < t < 4\)`,
  steps: [
    T`Set \(v(t) = 0\): \(t^2 - 6t + 8 = (t - 2)(t - 4) = 0\), so \(t = 2\) and \(t = 4\).`,
    T`Test a value in each interval: \(v(1) = 3 > 0\), \(v(3) = -1 < 0\), \(v(5) = 3 > 0\).`,
    T`<b>Sign chart:</b>${vtable([['\\(t\\)', ['\\(0<t<2\\)', '\\(2<t<4\\)', '\\(4<t<6\\)']], ['\\(v(t)\\)', ['\\(+\\)', '\\(-\\)', '\\(+\\)']], ['position', ['increasing', 'decreasing', 'increasing']]])}`,
    T`<b>Write it like this:</b> “The position is increasing on \(0 < t < 2\) and \(4 < t < 6\) because \(v(t) > 0\) there. It is decreasing on \(2 < t < 4\) because \(v(t) < 0\).”`
  ],
  trap: T`The justification must be about the sign of \(v(t)\), the <b>derivative</b> of position. Saying “because the graph goes up” earns nothing. At \(t = 2\) and \(t = 4\) itself, \(v = 0\), so those times are left out of both lists.`
},
{ id: 'u4A-8d', set: 'A', code: 'FRQ 8d', twin: 'u4B-8d', match: 'Test FRQ 8', topic: 'Evaluating a limit with L’Hôpital’s Rule', short: 'L’Hôpital limit', calc: false,
  type: 'num', answer: 2, label: T`\(\displaystyle\lim_{x\to 0}\frac{1 - \cos(2x)}{x^2} =\)`,
  prompt: T`<p>Find \(\displaystyle\lim_{x \to 0} \frac{1 - \cos(2x)}{x^2}\). Show the work that justifies using L’Hôpital’s Rule.</p>`,
  decode: T`Plug in first: \(1 - \cos 0 = 0\) and \(0^2 = 0\). That \(\frac{0}{0}\) is your permission to use L’Hôpital: differentiate the top and the bottom <b>separately</b> (not the Quotient Rule). If you get \(\frac{0}{0}\) again, do it again.`,
  ansTex: T`\(2\)`,
  steps: [
    T`Check the form: \(\displaystyle\lim_{x\to 0}\big(1 - \cos 2x\big) = 0\) and \(\displaystyle\lim_{x\to 0}x^2 = 0\). It’s \(\frac{0}{0}\), so L’Hôpital applies.`,
    T`Differentiate top and bottom: \(\displaystyle\lim_{x\to 0}\frac{2\sin(2x)}{2x}\). Plugging in gives \(\frac{0}{0}\) again.`,
    T`Apply it again: \(\displaystyle\lim_{x\to 0}\frac{4\cos(2x)}{2}\)`,
    T`\(= \dfrac{4\cos 0}{2} = \dfrac{4}{2} = 2\)`
  ],
  trap: T`The derivative of \(-\cos(2x)\) is \(+2\sin(2x)\): two sign flips and a Chain Rule 2. Missing the 2 on the second round gives 1. And never use the Quotient Rule here; L’Hôpital differentiates top and bottom on their own.`
},
{ id: 'u4A-9a', set: 'A', code: 'FRQ 9a', twin: 'u4B-9a', match: 'Test FRQ 9', topic: 'Average rate of change from a table, with units', short: 'Average rate with units', calc: true,
  type: 'num', answer: -45 / 7, tol: 0.0015, units: UNITS_A9, unitAns: '°F/min', label: T`Average rate on \(2 \le t \le 9\):`,
  help: 'A fraction like -45/7 is fine, or give 3 decimal places. Then choose the units.',
  prompt: T`${STEM_A9}<p>Find the average rate of change of \(H(t)\) over the interval \(2 \le t \le 9\). Include units.</p>`,
  decode: T`Average rate of change is the slope between the two <b>endpoints</b>: \(\dfrac{H(9) - H(2)}{9 - 2}\). Units are output units per input unit: °F per minute.`,
  ansTex: T`\(\dfrac{115 - 160}{9 - 2} = -\dfrac{45}{7} \approx -6.429\) °F/min`,
  steps: [
    T`\(\dfrac{H(9) - H(2)}{9 - 2} = \dfrac{115 - 160}{7}\)`,
    T`\(= -\dfrac{45}{7} \approx -6.429\)`,
    T`Units: degrees Fahrenheit per minute. <b>Answer: \(-6.429\) °F/min</b>`
  ],
  trap: T`Only the endpoints matter for an <b>average</b> rate; the value at \(t = 5\) is a distraction. Keep the negative sign: the coffee is cooling.`
},
{ id: 'u4A-9b', set: 'A', code: 'FRQ 9b', twin: 'u4B-9b', match: 'Test FRQ 9', topic: 'Approximating the instantaneous rate of change', short: 'Approximate IROC', calc: true,
  type: 'num', answer: -5.5, tol: 0.0015, units: UNITS_A9, unitAns: '°F/min', label: T`\(H'(7) \approx\)`,
  help: 'Give your answer as a number or fraction. Then choose the units.',
  prompt: T`${STEM_A9}<p>Use the data in the table to approximate \(H'(7)\). Include units.</p>`,
  decode: T`\(t = 7\) isn’t in the table, so you can’t read \(H'(7)\) directly. Approximate it with the slope between the two data points that <b>surround</b> it: \(t = 5\) and \(t = 9\).`,
  ansTex: T`\(H'(7) \approx \dfrac{115 - 137}{9 - 5} = -5.5\) °F/min`,
  steps: [
    T`The table times on either side of \(t = 7\) are \(t = 5\) and \(t = 9\).`,
    T`\(H'(7) \approx \dfrac{H(9) - H(5)}{9 - 5} = \dfrac{115 - 137}{4}\)`,
    T`\(= -\dfrac{22}{4} = -5.5\) °F/min`
  ],
  trap: T`On the free response, write the difference quotient \(\frac{H(9) - H(5)}{9 - 5}\) itself. A bare “−5.5” with no setup can lose the point even if it’s right.`
},
{ id: 'u4A-9c', set: 'A', code: 'FRQ 9c', twin: 'u4B-9c', match: 'Test FRQ 9', topic: 'Derivative in context, described with a sentence', short: 'Interpret H′(10)', calc: true,
  type: 'mc',
  prompt: T`${STEM_A9}<p>The temperature is modeled by \(H(t) = 70 + 110e^{-0.1t}\). Use your calculator to find \(H'(10)\). Which sentence correctly interprets the result?</p>`,
  decode: T`Find \(H'(10)\) with the calculator’s derivative function. A full interpretation has four pieces: <b>when</b> (at \(t = 10\) minutes), <b>what</b> (the coffee’s temperature), <b>direction</b> (increasing/decreasing from the sign), and <b>how fast, with units</b>.`,
  choices: [
    T`At \(t = 10\) minutes, the coffee’s temperature is \(-4.047\) °F.`,
    T`At \(t = 10\) minutes, the coffee’s temperature is decreasing at a rate of about 4.047 °F per minute.`,
    T`Over the first 10 minutes, the coffee’s temperature decreases by an average of 4.047 °F per minute.`,
    T`At \(t = 10\) minutes, the coffee’s temperature is decreasing at a rate of about 110.467 °F per minute.`
  ],
  ans: 1, ansTex: T`\(H'(10) \approx -4.047\): at \(t = 10\) min, the temperature is decreasing at about 4.047 °F/min`,
  steps: [
    T`Calculator: \(\dfrac{d}{dt}\big(70 + 110e^{-0.1t}\big)\Big|_{t=10} \approx -4.047\).`,
    T`(By hand: \(H'(t) = -11e^{-0.1t}\), so \(H'(10) = -11e^{-1} \approx -4.047\).)`,
    T`Negative means the temperature is going <b>down</b>. Units: °F per minute.`,
    T`“At \(t = 10\) minutes, the temperature of the coffee is decreasing at a rate of 4.047 °F per minute.” <b>Answer: B</b>`
  ],
  trap: T`Choice A calls a <b>rate</b> a temperature. Choice C describes an <b>average</b> over an interval, but a derivative is at one instant. Choice D is \(H(10)\), the temperature itself, not the derivative.`
},

{ id: 'u4B-mc1', set: 'B', code: 'MC 1', twin: 'u4A-mc1', match: 'Test MC #1', topic: 'Approximating a derivative from a table', short: 'Derivative from a table', calc: true,
  type: 'mc',
  prompt: T`<p>The temperature \(W(t)\), in °C, of a pot of water is recorded at selected times \(t\), in minutes. Using the data in the table, what is the best approximation of \(W'(4)\)?</p>${vtable([['\\(t\\)', [1, 3, 4, 6, 9]], ['\\(W(t)\\)', [40, 35, 31, 25, 19]]], 2)}`,
  decode: T`\(t = 4\) is in the table, so use the closest data on <b>both sides</b> (\(t = 3\) and \(t = 6\)) and find the slope between them.`,
  choices: [T`\(3.333\)`, T`\(-0.3\)`, T`\(-2.625\)`, T`\(-3.333\)`], ans: 3, ansTex: T`\(W'(4) \approx \dfrac{25 - 35}{6 - 3} \approx -3.333\) °C/min`,
  steps: [
    T`The neighbors of \(t = 4\) are \(t = 3\) and \(t = 6\).`,
    T`\(\dfrac{W(6) - W(3)}{6 - 3} = \dfrac{25 - 35}{3} = -\dfrac{10}{3}\)`,
    T`\(\approx -3.333\) °C per minute. <b>Answer: D</b>`
  ],
  trap: T`Choice C is the average rate over the <b>whole</b> table, which is too wide to estimate the rate at \(t = 4\). Choice A drops the sign: the water is cooling, so the rate is negative.`
},
{ id: 'u4B-mc2', set: 'B', code: 'MC 2', twin: 'u4A-mc2', match: 'Test MC #2', topic: 'Derivative in context: rate in − rate out', short: 'Rate in − rate out', calc: true,
  type: 'mc',
  prompt: T`<p>Cars enter a parking garage at a rate of \(E(t) = 120 + 40\sin\!\left(\dfrac{t}{3}\right)\) cars per hour and leave at a rate of \(L(t) = 25t\) cars per hour, where \(t\) is hours after the garage opens. At \(t = 7\), is the number of cars in the garage increasing or decreasing, and at what rate?</p>`,
  decode: T`Net rate = <b>rate in − rate out</b> = \(E(7) - L(7)\). Radian mode. A negative result means the number of cars is decreasing.`,
  choices: [T`Decreasing at about 26.077 cars per hour`, T`Increasing at about 26.077 cars per hour`, T`Decreasing at about 53.371 cars per hour`, T`Increasing at about 323.923 cars per hour`],
  ans: 0, ansTex: T`\(E(7) - L(7) \approx -26.077\) cars/hr, so decreasing`,
  steps: [
    T`Net rate: \(N'(t) = E(t) - L(t)\).`,
    T`\(E(7) = 120 + 40\sin\!\left(\frac{7}{3}\right) \approx 120 + 28.923 = 148.923\)`,
    T`\(L(7) = 25(7) = 175\)`,
    T`\(N'(7) \approx 148.923 - 175 = -26.077 < 0\): <b>decreasing</b> at about 26.077 cars per hour. <b>Answer: A</b>`
  ],

const NAMES = ['sqrt', 'sin', 'cos', 'tan', 'sec', 'csc', 'cot', 'ln', 'log', 'abs', 'pi', 'e', 'x', 'y', 't'];
const FUNCS = {
  sqrt: Math.sqrt, sin: Math.sin, cos: Math.cos, tan: Math.tan,
  sec: v => 1 / Math.cos(v), csc: v => 1 / Math.sin(v), cot: v => 1 / Math.tan(v),
  ln: Math.log, log: Math.log10, abs: Math.abs
};
function tokenize(s) {
  s = s.toLowerCase()
    .replace(/[−–—]/g, '-').replace(/[×·∙]/g, '*').replace(/÷/g, '/')
    .replace(/√/g, 'sqrt').replace(/π/g, 'pi').replace(/²/g, '^2').replace(/³/g, '^3');
  const out = []; let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (/\s/.test(c)) { i++; continue; }
    if (/[0-9.]/.test(c)) {
      const m = s.slice(i).match(/^(\d+\.?\d*|\.\d+)/);
      if (!m) throw new Error('number');
      out.push({ t: 'n', v: parseFloat(m[0]) }); i += m[0].length; continue;
    }
    if (/[a-z]/.test(c)) {
      const nm = NAMES.find(n => s.startsWith(n, i));
      if (!nm) throw new Error('Unknown letters: “' + s.slice(i).match(/^[a-z]+/)[0] + '”');
      out.push({ t: 'id', v: nm }); i += nm.length; continue;
    }
    if ('+-*/^(),'.includes(c)) { out.push({ t: c }); i++; continue; }
    if (c === '[' || c === '{') { out.push({ t: '(' }); i++; continue; }
    if (c === ']' || c === '}') { out.push({ t: ')' }); i++; continue; }
    throw new Error('Unexpected “' + c + '”');
  }
  return out;
}
function compile(src) {
  const tk = tokenize(src); let p = 0;
  const peek = () => tk[p], take = () => tk[p++];
  const startsFactor = t => t && (t.t === 'n' || t.t === 'id' || t.t === '(');
  function expr() {
    let a = term();
    while (peek() && (peek().t === '+' || peek().t === '-')) {
      const op = take().t, b = term(), l = a;
      a = op === '+' ? (v => l(v) + b(v)) : (v => l(v) - b(v));
    }
    return a;
  }
  function term() {
    let a = unary();
    while (true) {
      const t = peek();
      if (t && (t.t === '*' || t.t === '/')) {
        take(); const b = unary(), l = a;
        a = t.t === '*' ? (v => l(v) * b(v)) : (v => l(v) / b(v));
      } else if (startsFactor(t)) {
        const b = power(), l = a; a = v => l(v) * b(v);
      } else break;
    }
    return a;
  }
  function unary() {
    const t = peek();
    if (t && t.t === '-') { take(); const a = unary(); return v => -a(v); }
    if (t && t.t === '+') { take(); return unary(); }
    return power();
  }
  function power() {
    const base = primary();
    if (peek() && peek().t === '^') { take(); const ex = unary(); return v => Math.pow(base(v), ex(v)); }
    return base;
  }
  function primary() {
    const t = take();
    if (!t) throw new Error('Incomplete answer');
    if (t.t === 'n') { const n = t.v; return () => n; }
    if (t.t === '(') { const a = expr(); if (!peek() || take().t !== ')') throw new Error('Missing “)”'); return a; }
    if (t.t === 'id') {
      if (t.v === 'pi') return () => Math.PI;
      if (t.v === 'e') return () => Math.E;
      if (t.v === 'x') return v => v.x;
      if (t.v === 'y') return v => v.y;
      if (t.v === 't') return v => v.t;
      const fn = FUNCS[t.v];
      let arg;
      if (peek() && peek().t === '(') arg = primary(); else arg = power();
      return v => fn(arg(v));
    }
    throw new Error('Unexpected “' + t.t + '”');
  }
  const f = expr();
  if (p < tk.length) throw new Error('Check your answer near “' + (tk[p].v ?? tk[p].t) + '”');
  return f;
}
const close = (a, b) => Number.isFinite(a) && Math.abs(a - b) <= 1e-6 * Math.max(1, Math.abs(b));
